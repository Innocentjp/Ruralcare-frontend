<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Patient Intake | RuralCare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#52B788">
<link rel="apple-touch-icon" href="./img/icon-192.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./img/icon-192.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        headingDark: '#0F172A',
        greenAccent: '#52B788',
        greenDark: '#43A073'
      },
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        mono: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'sans-serif']
      }
    }
  }
};
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<style>
* {
  font-feature-settings: "zero" 0 !important;
  font-variant-numeric: normal !important;
}
</style>
<script>(function(){ if ((localStorage.getItem('ruralcare_theme')||'light')==='dark') document.documentElement.classList.add('dark'); })();</script>
</head>
<body class="antialiased bg-[#F8FAFC] dark:bg-[#070D18] text-[#1E293B] dark:text-[#E7EBF3] min-h-screen pb-28 md:pb-12 transition-colors overflow-x-hidden">
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-[#070D18]/95 backdrop-blur border-b border-[#E5E7EB] dark:border-white/5">
    <div class="w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between relative">
      <div class="flex items-center gap-3 min-w-0 shrink-0">
        <a href="dashboard.html" class="w-8 h-8 rounded-full border border-[#E5E7EB] dark:border-white/10 flex items-center justify-center shrink-0 text-[#64748B] dark:text-[#8B94A7] hover:bg-[#F1F5F9] dark:hover:bg-white/5 transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <div class="min-w-0">
          <h1 class="text-[15px] font-semibold tracking-tight truncate hidden sm:block text-[#0D3B66] dark:text-white" data-i18n="intake-title">New Patient Intake</h1>
          <div class="flex items-start gap-1 min-w-0 text-[10.5px] font-semibold text-amber-600 dark:text-amber-500">
            <i data-lucide="wifi-off" class="w-3 h-3 shrink-0 mt-0.5"></i><span class="leading-snug">Offline mode — data queues for sync</span>
          </div>
        </div>
      </div>

      <nav class="hidden md:flex absolute left-1/2 -translate-x-1/2 items-center justify-center gap-2">
        <a href="dashboard.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 font-semibold text-[13px] hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span data-i18n="nav-dash">Dashboard</span></a>
        <a href="intake.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#52B788] hover:bg-[#43A073] text-white font-semibold text-[13px] shadow-sm transition-all"><i data-lucide="user-plus" class="w-4 h-4"></i><span data-i18n="nav-new">New Patient</span></a>
      </nav>

      <div class="flex items-center gap-4 shrink-0">
        <span data-sync-badge data-extra-class="hidden sm:inline-flex" class="pill pill-success hidden sm:inline-flex"></span>
        <button data-theme-toggle role="switch" aria-checked="false" aria-label="Toggle dark mode" class="theme-toggle">
          <span class="knob"><i data-lucide="sun" class="dark:hidden"></i><i data-lucide="moon" class="hidden dark:block"></i></span>
        </button>
        <div class="relative">
          <button data-profile-trigger type="button" aria-label="Account menu" class="w-9 h-9 rounded-full bg-[#52B788]/15 text-[#52B788] font-semibold text-[12.5px] flex items-center justify-center border border-[#52B788]/30 hover:ring-2 hover:ring-[#52B788]/40 active:scale-95 transition-all cursor-pointer" data-avatar-initials>IE</button>
          <div data-profile-menu class="hidden absolute right-0 mt-2 w-56 card p-2 z-50">
            <div class="px-3 py-2.5 border-b border-[#E5E7EB] dark:border-white/5 mb-1">
              <p class="text-[14px] font-semibold text-[#1E293B] dark:text-[#E7EBF3] truncate" data-profile-name>User</p>
              <p class="text-[12.5px] text-[#64748B] dark:text-[#8B94A7] mt-0.5 truncate" data-profile-role>RuralCare</p>
            </div>
            <a href="profile.html" class="flex items-center gap-2 px-3 py-2 w-full text-left rounded-lg text-[13px] font-semibold text-[#1E293B] dark:text-[#E7EBF3] hover:bg-[#F1F5F9] dark:hover:bg-white/5 transition-colors"><i data-lucide="user" class="w-4 h-4"></i><span data-i18n="nav-profile">Profile</span></a>
            <a href="settings.html" class="flex items-center gap-2 px-3 py-2 w-full text-left rounded-lg text-[13px] font-semibold text-[#1E293B] dark:text-[#E7EBF3] hover:bg-[#F1F5F9] dark:hover:bg-white/5 transition-colors"><i data-lucide="settings" class="w-4 h-4"></i><span data-i18n="nav-settings">Settings</span></a>
            <div class="my-1 border-t border-[#E5E7EB] dark:border-white/5"></div>
            <button type="button" onclick="showLogoutModal()" class="flex items-center gap-2 px-3 py-2 w-full text-left rounded-lg text-[13px] font-semibold text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i><span data-i18n="nav-logout">Log Out</span></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 pt-6">
    <form id="intake-form" novalidate>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 lg:gap-6">

        <section class="card p-6">
          <h2 class="text-[15px] font-semibold mb-6 flex items-center gap-2.5 text-[#0D3B66] dark:text-white"><i data-lucide="clipboard-list" class="w-[18px] h-[18px] text-[#52B788]"></i><span data-i18n="sec-demo">Demographics</span></h2>
          <div class="space-y-5">
            <div>
              <label class="block text-[12.5px] font-semibold mb-1.5">Patient ID</label>
              <div class="relative flex items-center">
                <i data-lucide="fingerprint" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
                <input type="text" id="patient-id" readonly class="input-field pl-10 !bg-[#F1F5F9] dark:!bg-white/[0.03] !text-[#64748B] dark:!text-[#8B94A7]">
              </div>
            </div>
            <div>
              <label class="block text-[12.5px] font-semibold mb-1.5">Full name <span class="text-[#DC2626]">*</span></label>
              <input type="text" id="patient-name" placeholder="e.g. Jane Doe" class="input-field">
              <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[12.5px] font-semibold mb-1.5">Age <span class="text-[#DC2626]">*</span></label>
                <input type="number" min="0" max="120" id="patient-age" placeholder="34" class="input-field">
                <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
              </div>
              <div>
                <label class="block text-[12.5px] font-semibold mb-1.5">Contact number</label>
                <input type="tel" id="patient-contact" placeholder="+234 800 000 0000" class="input-field">
              </div>
            </div>
            <div>
              <label class="block text-[12.5px] font-semibold mb-2">Gender</label>
              <div class="segmented" id="gender-segmented">
                <button type="button" data-value="Female" class="active">Female</button>
                <button type="button" data-value="Male">Male</button>
                <button type="button" data-value="Other">Other</button>
              </div>
              <input type="hidden" id="patient-gender" value="Female">
            </div>
            <div>
              <label class="block text-[12.5px] font-semibold mb-1.5">Community / village</label>
              <div class="relative flex items-center">
                <i data-lucide="map-pin" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
                <input type="text" id="patient-community" placeholder="e.g. Umuoji" class="input-field pl-10">
              </div>
            </div>
          </div>
        </section>

        <div class="flex flex-col gap-5 lg:gap-6">
          <section class="card p-6">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-[15px] font-semibold flex items-center gap-2.5 text-[#0D3B66] dark:text-white"><i data-lucide="activity" class="w-[18px] h-[18px] text-[#52B788]"></i><span data-i18n="sec-vitals">Vitals</span></h2>
            </div>
            <div class="space-y-5">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-[12.5px] font-semibold">Blood pressure</label>
                  <span class="text-[11px] font-bold text-[#52B788]">mmHg</span>
                </div>
                <div class="flex items-center gap-3">
                  <input type="number" id="vital-bp-sys" placeholder="120" class="input-field text-center">
                  <span class="text-[#94A3B8] font-semibold text-lg">/</span>
                  <input type="number" id="vital-bp-dia" placeholder="80" class="input-field text-center">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[12.5px] font-semibold">Temperature</label>
                    <button type="button" id="temp-unit-toggle" class="text-[11px] font-bold text-[#52B788]">°C</button>
                  </div>
                  <input type="number" step="0.1" id="vital-temp" placeholder="36.6" class="input-field text-center">
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[12.5px] font-semibold">Heart rate</label>
                    <span class="text-[11px] font-bold text-[#52B788]">bpm</span>
                  </div>
                  <input type="number" id="vital-hr" placeholder="72" class="input-field text-center">
                </div>
              </div>
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-[12.5px] font-semibold">SpO2</label>
                  <span class="text-[11px] font-bold text-[#52B788]">%</span>
                </div>
                <input type="number" min="0" max="100" id="vital-spo2" placeholder="98" class="input-field text-center">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[12.5px] font-semibold">Respiratory rate</label>
                    <span class="text-[11px] font-bold text-[#52B788]">/min</span>
                  </div>
                  <input type="number" min="0" max="90" id="vital-rr" placeholder="20" class="input-field text-center">
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[12.5px] font-semibold">Weight</label>
                    <span class="text-[11px] font-bold text-[#52B788]">kg</span>
                  </div>
                  <input type="number" step="0.1" min="0" max="300" id="patient-weight" placeholder="60" class="input-field text-center">
                </div>
              </div>
              <label class="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" id="patient-pregnant" class="w-4 h-4 accent-[#52B788]">
                <span class="text-[12.5px] font-semibold">Patient is pregnant</span>
              </label>
            </div>
          </section>

          <section class="card p-6 flex-1 flex flex-col">
            <h2 class="text-[15px] font-semibold mb-5 flex items-center gap-2.5 text-[#0D3B66] dark:text-white"><i data-lucide="stethoscope" class="w-[18px] h-[18px] text-[#52B788]"></i><span data-i18n="sec-symp">Symptoms</span></h2>
            <div id="symptom-chips" class="flex flex-wrap gap-2.5"></div>
            <div class="mt-5 flex-1 flex flex-col">
              <label class="block text-[12.5px] font-semibold mb-2" data-i18n="sec-notes">Clinical notes</label>
              <div id="notes-wrap" class="relative flex-1">
                <textarea id="symptoms-notes" rows="3" placeholder="Additional observations..." class="input-field resize-y w-full h-full pb-14"></textarea>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div class="mt-4 flex flex-col sm:flex-row gap-4 justify-end border-t border-[#E5E7EB] dark:border-white/5 pt-4">
        <a href="dashboard.html" class="w-full sm:w-48 py-3.5 flex justify-center items-center rounded-xl border border-dashed border-[#CBD5E1] dark:border-white/15 text-[#64748B] dark:text-[#8B94A7] font-semibold text-[13px] hover:bg-[#F1F5F9] dark:hover:bg-white/5 transition-colors" data-i18n="btn-cancel">Cancel</a>
        <button type="submit" class="btn-primary w-full sm:w-72 py-3.5 flex justify-center items-center gap-2 text-[13px] shadow-sm bg-[#52B788] hover:bg-[#43A073] text-white transition-colors">
          <i data-lucide="cloud-upload" class="w-4 h-4"></i><span data-i18n="btn-save">Save & Queue for Sync</span>
        </button>
      </div>
    </form>
  </main>

  <div id="logout-modal" class="fixed inset-0 z-[60] hidden">
    <div class="absolute inset-0 bg-[#0D1B2A]/60 backdrop-blur-sm" onclick="hideLogoutModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-[340px] px-4">
      <div class="card p-6 w-full shadow-xl">
        <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-950/40 flex items-center justify-center mb-4">
          <i data-lucide="log-out" class="w-6 h-6 text-red-600"></i>
        </div>
        <h3 class="text-[17px] font-semibold mb-1.5">Sign Out?</h3>
        <p class="text-[13px] text-slate-500 mb-6 leading-relaxed">Are you sure you want to log out? Your pending data is safely stored on this device until you sync.</p>
        <div class="flex gap-3">
          <button onclick="hideLogoutModal()" class="flex-1 py-2.5 rounded-xl border border-[#E5E7EB] dark:border-white/10 text-[13px] font-semibold text-slate-600 hover:bg-slate-50 transition-colors">Cancel</button>
          <button onclick="confirmLogout()" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-[13px] font-semibold hover:bg-red-700 transition-colors">Sign Out</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/index.js"></script>
  <script>
    RC.requireSession();

    function showLogoutModal() { document.getElementById('logout-modal').classList.remove('hidden'); }
    function hideLogoutModal() { document.getElementById('logout-modal').classList.add('hidden'); }
    function confirmLogout() { RC.clearSession(); window.location.href = 'auth.html'; }

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    const editingPatient = editId ? RC.getPatients().find(p => p.id === editId) : null;
    const chipsWrap = document.getElementById('symptom-chips');

    RC.SYMPTOM_OPTIONS.forEach(s => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.value = s;
      chip.textContent = s;
      chip.addEventListener('click', () => chip.classList.toggle('active'));
      chipsWrap.appendChild(chip);
    });

    let tempUnit = 'C';
    const tempInput = document.getElementById('vital-temp');
    const tempToggle = document.getElementById('temp-unit-toggle');

    if (editId && editingPatient) {
      document.getElementById('patient-id').value = editingPatient.id;
      document.getElementById('patient-name').value = editingPatient.name;
      document.getElementById('patient-age').value = editingPatient.age;
      document.getElementById('patient-contact').value = editingPatient.contact || '';
      document.getElementById('patient-community').value = editingPatient.community || '';
      document.getElementById('patient-gender').value = editingPatient.gender;
      
      document.querySelectorAll('#gender-segmented button').forEach(b => {
        b.classList.remove('active');
        if(b.dataset.value === editingPatient.gender) b.classList.add('active');
      });

      document.getElementById('vital-bp-sys').value = editingPatient.vitals?.bpSys || '';
      document.getElementById('vital-bp-dia').value = editingPatient.vitals?.bpDia || '';
      document.getElementById('vital-temp').value = editingPatient.vitals?.temp || '';
      document.getElementById('vital-hr').value = editingPatient.vitals?.hr || '';
      document.getElementById('vital-spo2').value = editingPatient.vitals?.spo2 || '';
      document.getElementById('vital-rr').value = editingPatient.vitals?.rr || '';
      document.getElementById('patient-weight').value = editingPatient.weight || '';
      document.getElementById('patient-pregnant').checked = !!editingPatient.pregnant;
      document.getElementById('symptoms-notes').value = editingPatient.notes || '';

      if (editingPatient.symptoms) {
        editingPatient.symptoms.forEach(s => {
          const chip = document.querySelector(`.chip[data-value="${s}"]`);
          if (chip) chip.classList.add('active');
        });
      }
    } else {
      document.getElementById('patient-id').value = RC.generatePatientId();
    }

    const genderSeg = document.getElementById('gender-segmented');
    genderSeg.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        genderSeg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('patient-gender').value = btn.dataset.value;
      });
    });

    tempToggle.addEventListener('click', () => {
      const val = parseFloat(tempInput.value);
      if (!isNaN(val)) {
        tempInput.value = tempUnit === 'C' ? RC.cToF(val).toFixed(1) : RC.fToC(val).toFixed(1);
      }
      tempUnit = tempUnit === 'C' ? 'F' : 'C';
      tempToggle.textContent = '°' + tempUnit;
      tempInput.placeholder = tempUnit === 'C' ? '36.6' : '97.9';
    });

    function clearErrors() {
      document.querySelectorAll('.field-error-text').forEach(e => { e.classList.add('hidden'); e.textContent = ''; });
      document.querySelectorAll('.input-field').forEach(e => e.classList.remove('field-error'));
    }
    
    function showError(id, message) {
      const field = document.getElementById(id);
      field.classList.add('field-error');
      const p = field.closest('div').parentElement.querySelector('.field-error-text') || field.parentElement.parentElement.querySelector('.field-error-text');
      if (p) { p.textContent = message; p.classList.remove('hidden'); }
    }

    document.getElementById('intake-form').addEventListener('submit', (e) => {
      e.preventDefault();
      clearErrors();
      let valid = true;
      const name = document.getElementById('patient-name').value.trim();
      const age = document.getElementById('patient-age').value;
      if (!name) { showError('patient-name', 'Full name is required.'); valid = false; }
      if (!age) { showError('patient-age', 'Age is required.'); valid = false; }
      if (!valid) return;

      const tempRaw = parseFloat(document.getElementById('vital-temp').value);
      const tempCelsius = document.getElementById('vital-temp').value
        ? (tempUnit === 'C' ? tempRaw : RC.fToC(tempRaw)).toFixed(1)
        : '';

      const selectedSymptoms = Array.from(chipsWrap.querySelectorAll('.chip.active')).map(c => c.dataset.value);
      const session = RC.getSession() || {};
      const currentEmail = (session.email || '').toLowerCase();

      const pid = document.getElementById('patient-id').value;
      const existingPatient = RC.getPatientById(pid);
      
      let recordDate = new Date().toISOString();
      let owner = currentEmail;
      let isDemo = false;
      let visitsList = [];
      let isEdited = false;

      if (existingPatient) {
        isEdited = true;
        if (existingPatient.createdAt) recordDate = existingPatient.createdAt;
        if (existingPatient.createdBy) owner = existingPatient.createdBy;
        if (existingPatient.isDemo !== undefined) isDemo = existingPatient.isDemo;
        visitsList = Array.isArray(existingPatient.visits) && existingPatient.visits.length > 0
          ? existingPatient.visits
          : [{
              id: 'v-' + Date.now(),
              date: recordDate,
              createdAt: recordDate,
              facility: session.clinic || '',
              vitals: {
                bpSys: document.getElementById('vital-bp-sys').value || '',
                bpDia: document.getElementById('vital-bp-dia').value || '',
                temp: tempCelsius,
                hr: document.getElementById('vital-hr').value || '',
                spo2: document.getElementById('vital-spo2').value || '',
                rr: document.getElementById('vital-rr').value || ''
              },
              symptoms: selectedSymptoms,
              notes: document.getElementById('symptoms-notes').value.trim()
            }];
      } else {
        visitsList = [{
          id: 'v-' + Date.now(),
          date: recordDate,
          createdAt: recordDate,
          facility: session.clinic || '',
          vitals: {
            bpSys: document.getElementById('vital-bp-sys').value || '',
            bpDia: document.getElementById('vital-bp-dia').value || '',
            temp: tempCelsius,
            hr: document.getElementById('vital-hr').value || '',
            spo2: document.getElementById('vital-spo2').value || '',
            rr: document.getElementById('vital-rr').value || ''
          },
          symptoms: selectedSymptoms,
          notes: document.getElementById('symptoms-notes').value.trim()
        }];
      }

      const patient = {
        id: pid,
        name,
        age,
        gender: document.getElementById('patient-gender').value,
        contact: document.getElementById('patient-contact').value.trim(),
        community: document.getElementById('patient-community').value.trim(),
        state: session.state || '',
        lga: session.lga || '',
        facility: session.clinic || '',
        createdBy: owner,
        isDemo,
        isEdited,
        editedAt: isEdited ? new Date().toISOString() : undefined,
        vitals: {
          bpSys: document.getElementById('vital-bp-sys').value || '',
          bpDia: document.getElementById('vital-bp-dia').value || '',
          temp: tempCelsius,
          hr: document.getElementById('vital-hr').value || '',
          spo2: document.getElementById('vital-spo2').value || '',
          rr: document.getElementById('vital-rr').value || ''
        },
        weight: document.getElementById('patient-weight').value || '',
        pregnant: document.getElementById('patient-pregnant').checked,
        symptoms: selectedSymptoms,
        notes: document.getElementById('symptoms-notes').value.trim(),
        createdAt: recordDate,
        status: 'queued',
        reviewed: false,
        visits: visitsList
      };

      RC.savePatient(patient);
      window.location.href = 'dashboard.html';
    });

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
