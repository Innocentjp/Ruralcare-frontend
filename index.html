<body class="bg-white text-slateDark font-sans selection:bg-greenMedical selection:text-white">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
gsap.registerPlugin(ScrollTrigger);

const AUTH_URL = 'auth.html';

const navigateAuth = (target) => {
  try {
    sessionStorage.setItem('ruralcare_next', target);
  } catch(e) {}
  window.location.href = `${AUTH_URL}?next=${encodeURIComponent(target)}`;
};

function App() {
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [vitals, setVitals] = useState({ sys: '164', dia: '102', temp: '37.1', spo2: '94' });
  const [triageOutput, setTriageOutput] = useState({ level: 'CRITICAL', label: 'Critical Urgency', flags: [] });

  const rootRef = useRef(null);
  const heroTextRef = useRef(null);
  const heroBgRef = useRef(null);

  const assess = (s, d, t, o) => {
    const systolic = parseInt(s, 10);
    const diastolic = parseInt(d, 10);
    const temperature = parseFloat(t);
    const oxygen = parseInt(o, 10);

    let level = 'NORMAL';
    let label = 'Normal Baseline';
    const flags = [];

    if (oxygen && oxygen < 92) {
      level = 'CRITICAL';
      label = 'Critical Urgency';
      flags.push('SpO2 below 92% (Severe Hypoxia Risk)');
    } else if (oxygen && oxygen < 95) {
      if (level !== 'CRITICAL') { level = 'REVIEW'; label = 'Needs Review'; }
      flags.push('SpO2 borderline (92-94%)');
    }

    if (systolic && diastolic) {
      if (systolic >= 160 || diastolic >= 100) {
        level = 'CRITICAL';
        label = 'Critical Urgency';
        flags.push('Blood pressure in Hypertensive Crisis range (≥ 160/100 mmHg)');
      } else if (systolic >= 140 || diastolic >= 90) {
        if (level !== 'CRITICAL') { level = 'REVIEW'; label = 'Needs Review'; }
        flags.push('Stage 2 Hypertension range (≥ 140/90 mmHg)');
      }
    }

    if (temperature && temperature >= 39.0) {
      level = 'CRITICAL';
      label = 'Critical Urgency';
      flags.push('High-grade fever (≥ 39.0 °C)');
    } else if (temperature && temperature >= 38.0) {
      if (level !== 'CRITICAL') { level = 'REVIEW'; label = 'Needs Review'; }
      flags.push('Febrile reading recorded (≥ 38.0 °C)');
    }

    if (flags.length === 0) {
      flags.push('Readings are within stable baseline limits');
    }

    setTriageOutput({ level, label, flags });
  };

  useEffect(() => {
    assess(vitals.sys, vitals.dia, vitals.temp, vitals.spo2);
  }, [vitals]);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();

    const ctx = gsap.context(() => {
      gsap.from(heroTextRef.current.children, {
        y: 35,
        opacity: 0,
        duration: 0.9,
        stagger: 0.15,
        ease: 'power3.out'
      });

      gsap.to(heroBgRef.current, {
        yPercent: 18,
        ease: 'none',
        scrollTrigger: {
          trigger: '#hero-section',
          start: 'top top',
          end: 'bottom top',
          scrub: true
        }
      });

      gsap.utils.toArray('.anim-card').forEach((card) => {
        gsap.fromTo(card, 
          { y: 35, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: 'power3.out',
            scrollTrigger: {
              trigger: card,
              start: 'top 88%',
              end: 'bottom 12%',
              toggleActions: 'play reverse play reverse'
            }
          }
        );
      });

      gsap.utils.toArray('.anim-heading').forEach((heading) => {
        gsap.fromTo(heading,
          { y: 25, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: 'power3.out',
            scrollTrigger: {
              trigger: heading,
              start: 'top 90%',
              end: 'bottom 10%',
              toggleActions: 'play reverse play reverse'
            }
          }
        );
      });
    }, rootRef);

    return () => ctx.revert();
  }, []);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [mobileMenuOpen, triageOutput]);

  return (
    <div ref={rootRef} className="min-h-screen flex flex-col bg-white"> 
      <header className="fixed top-0 inset-x-0 z-50 bg-white border-b border-slate-200/80 shadow-sm transition-all duration-300">
        <div className="w-full px-5 sm:px-10 lg:px-16 h-20 flex items-center justify-between">
          
          <a href="index.html" className="flex items-center">
            <img 
              src="img/logo-icon-color.png" 
              alt="Logo" 
              className="h-9 w-auto object-contain logo-transparent" 
            />
          </a>

          <nav className="hidden lg:flex items-center gap-8 text-[14px] font-semibold text-slateDark">
            <a href="#how" className="nav-link hover:text-greenMedical">Clinical Workflow</a>
            <a href="#ward" className="nav-link hover:text-greenMedical">Ward Realities</a>
            <a href="#roles" className="nav-link hover:text-greenMedical">Care Continuum</a>
            <a href="#features" className="nav-link hover:text-greenMedical">Architecture</a>
            <a href="#simulator" className="nav-link hover:text-greenMedical">Triage Engine</a>
            <a href="#protocols" className="nav-link hover:text-greenMedical">Protocols</a>
            <a href="#faq" className="nav-link hover:text-greenMedical">FAQ</a>
          </nav>

          <div className="hidden sm:flex items-center gap-4">
            <button 
              onClick={() => navigateAuth('dashboard.html')} 
              className="nav-link text-[14px] font-semibold text-slateDark hover:text-greenMedical px-3 py-2"
            >
              Sign In
            </button>
            <button 
              onClick={() => navigateAuth('intake.html')} 
              className="h-11 px-5 rounded-lg bg-greenMedical hover:bg-slateDark text-white text-[14px] font-semibold flex items-center gap-2 shadow-sm hover:shadow transition-all duration-200 active:scale-95"
            >
              <i data-lucide="plus-circle" className="w-4 h-4"></i>
              <span>Patient Intake</span>
            </button>
          </div>

          <button 
            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
            className="lg:hidden w-11 h-11 rounded-lg border border-slate-200 flex items-center justify-center text-slateDark hover:border-greenMedical hover:text-greenMedical transition-colors"
            aria-label="Toggle Navigation"
          >
            <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-5 h-5"></i>
          </button>
        </div>

        {mobileMenuOpen && (
          <div className="lg:hidden px-6 pt-3 pb-6 bg-white border-b border-slate-200 flex flex-col gap-3 font-semibold text-[15px] shadow-xl">
            <a href="#how" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">Clinical Workflow</a>
            <a href="#ward" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">Ward Realities</a>
            <a href="#roles" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">Care Continuum</a>
            <a href="#features" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">Architecture</a>
            <a href="#simulator" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">Triage Engine</a>
            <a href="#protocols" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">Protocols</a>
            <a href="#faq" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-100 hover:text-greenMedical transition-colors">FAQ</a>
            <div className="pt-2 flex flex-col gap-2">
              <button onClick={() => navigateAuth('dashboard.html')} className="w-full h-12 flex items-center justify-center rounded-lg border border-slateDark text-slateDark font-semibold hover:bg-slate-50 transition-all">
                Sign In
              </button>
              <button onClick={() => navigateAuth('intake.html')} className="w-full h-12 flex items-center justify-center rounded-lg bg-greenMedical text-white font-semibold hover:bg-emerald-600 transition-all">
                Patient Intake
              </button>
            </div>
          </div>
        )}
      </header>

      <section id="hero-section" className="relative min-h-[700px] lg:min-h-[780px] flex items-center pt-28 pb-20 px-5 sm:px-10 lg:px-16 overflow-hidden">
        <div className="absolute inset-0 overflow-hidden">
          <img 
            ref={heroBgRef}
            src="image_b81526.jpg" 
            alt="Doctor caring for patient" 
            className="w-full h-[125%] -top-[12%] relative object-cover object-[70%_25%]"
            onError={(e) => { e.target.src = 'img/hero-care.png'; }}
          />
          <div className="absolute inset-0 bg-gradient-to-r from-slateDark/95 via-slateDark/85 to-slateDark/65"></div>
        </div>

        <div className="relative z-10 max-w-7xl mx-auto w-full">
          <div ref={heroTextRef} className="max-w-2xl text-white">
            
            <div className="flex items-center gap-2 mb-4">
              <span className="w-5 h-[2px] bg-greenMedical"></span>
              <span className="font-mono text-xs font-semibold tracking-widest text-greenMedical uppercase">
                Hospital Dead-Zone Solution
              </span>
            </div>

            <h1 className="font-extrabold text-[40px] sm:text-[54px] lg:text-[64px] leading-[1.06] tracking-tight text-white">
              Triage that keeps moving when the <span className="text-greenMedical">signal drops.</span>
            </h1>

            <p className="mt-6 text-[16px] sm:text-[18px] leading-relaxed text-white/85 font-normal max-w-xl">
              Engineered for clinicians facing connectivity blackouts in lead-lined radiology suites, basement labs, and rural wards. Capture vitals locally, trigger instant clinical flags, and background-sync once reconnected.
            </p>

            <div className="mt-8 flex flex-col sm:flex-row items-stretch sm:items-center gap-3.5 w-full sm:w-auto">
              <button 
                onClick={() => navigateAuth('dashboard.html')} 
                className="h-12 px-6 rounded-lg bg-greenMedical hover:bg-emerald-600 text-white font-semibold text-[14px] flex items-center justify-center gap-2 shadow-sm transition-all duration-200 active:scale-[0.98]"
              >
                <span>Access Clinical Queue</span>
                <i data-lucide="arrow-right" className="w-4 h-4"></i>
              </button>
              <button 
                onClick={() => navigateAuth('intake.html')} 
                className="h-12 px-6 rounded-lg border border-white/60 hover:bg-white/10 text-white font-semibold text-[14px] flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98]"
              >
                <span>Start Bedside Intake</span>
              </button>
            </div>

            <div className="mt-12 pt-8 border-t border-white/15 grid grid-cols-3 gap-6 max-w-lg">
              <div>
                <p className="font-mono font-bold text-2xl sm:text-3xl text-white">100%</p>
                <p className="text-[12px] text-white/70 font-medium uppercase tracking-wider mt-0.5">Offline-First</p>
              </div>
              <div>
                <p className="font-mono font-bold text-2xl sm:text-3xl text-greenMedical">&lt; 0.1s</p>
                <p className="text-[12px] text-white/70 font-medium uppercase tracking-wider mt-0.5">Local Triage</p>
              </div>
              <div>
                <p className="font-mono font-bold text-2xl sm:text-3xl text-white">0 Loss</p>
                <p className="text-[12px] text-white/70 font-medium uppercase tracking-wider mt-0.5">Cached Sync</p>
              </div>
            </div>

          </div>
        </div>
      </section>

      <section id="how" className="py-20 sm:py-28 bg-slate-50/60 border-b border-slate-200/80">
        <div className="max-w-7xl mx-auto px-5 sm:px-10 lg:px-16">
          
          <div className="anim-heading max-w-2xl">
            <p className="font-mono text-xs font-semibold tracking-widest text-greenMedical uppercase">Workflow Protocol</p>

          </div>

          <div className="mt-12 grid sm:grid-cols-3 gap-6 sm:gap-8">
            <div className="anim-card p-7 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:border-greenMedical/60 hover:shadow-md transition-all duration-300 flex flex-col justify-between">
              <div>
                <span className="font-mono text-xs font-semibold text-greenMedical tracking-wider">PHASE 01</span>
                <h3 className="mt-3 font-bold text-lg text-slateDark">Capture & Record</h3>
                <p className="mt-2 text-slate-600 text-[14px] leading-relaxed font-normal">

                </p>
              </div>
              <div className="mt-6 pt-4 border-t border-slate-100 flex items-center gap-2 text-[12px] text-slate-500 font-medium">
                <i data-lucide="database" className="w-4 h-4 text-greenMedical"></i>
                <span>Stored in IndexedDB instantly</span>
              </div>
            </div>

            <div className="anim-card p-7 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:border-greenMedical/60 hover:shadow-md transition-all duration-300 flex flex-col justify-between">
              <div>
                <span className="font-mono text-xs font-semibold text-greenMedical tracking-wider">PHASE 02</span>
                <h3 className="mt-3 font-bold text-lg text-slateDark">Instant Triage Flags</h3>
                <p className="mt-2 text-slate-600 text-[14px] leading-relaxed font-normal">
                  The clinical insight engine checks inputs against age-adjusted baseline thresholds, sorting patients into Urgent, Review, and Clear.
                </p>
              </div>
              <div className="mt-6 pt-4 border-t border-slate-100 flex items-center gap-2 text-[12px] text-slate-500 font-medium">
                <i data-lucide="shield-alert" className="w-4 h-4 text-greenMedical"></i>
                <span>Zero server latency</span>
              </div>
            </div>

            <div className="anim-card p-7 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:border-greenMedical/60 hover:shadow-md transition-all duration-300 flex flex-col justify-between">
              <div>
                <span className="font-mono text-xs font-semibold text-greenMedical tracking-wider">PHASE 03</span>
                <h3 className="mt-3 font-bold text-lg text-slateDark">Sync & Refer</h3>
                <p className="mt-2 text-slate-600 text-[14px] leading-relaxed font-normal">
                  Auto-sync pushes queued records when Wi-Fi returns. 1-tap referral sheets generate transfer briefs ready for tertiary hospital handoffs.
                </p>
              </div>
              <div className="mt-6 pt-4 border-t border-slate-100 flex items-center gap-2 text-[12px] text-slate-500 font-medium">
                <i data-lucide="refresh-cw" className="w-4 h-4 text-greenMedical"></i>
                <span>SMS sync for total blackouts</span>
              </div>
            </div>
          </div>

        </div>
      </section>

      <section id="ward" className="py-20 sm:py-28 bg-white border-b border-slate-200/80">
        <div className="max-w-7xl mx-auto px-5 sm:px-10 lg:px-16 grid lg:grid-cols-12 gap-12 items-center">
          
          <div className="anim-card lg:col-span-6">
            <div className="rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
              <img 
                src="./img/ward-tablet.jpg" 
                alt="Health worker reviewing digital records on a ward tablet" 
                className="w-full h-full aspect-[4/3] object-cover block"
              />
            </div>
          </div>

          <div className="anim-heading lg:col-span-6 flex flex-col items-start">
            <p className="font-mono text-xs font-semibold tracking-widest text-greenMedical uppercase">Ward Realities</p>
            <h2 className="mt-2 font-bold text-3xl sm:text-4xl text-slateDark tracking-tight">
              Designed around how busy clinical wards actually run.
            </h2>
            <p className="mt-3 text-slate-600 text-[15px] leading-relaxed font-normal">
              When clinical corridors and isolation units lose wireless signal, data entry cannot come to a standstill.
            </p>

            <ul className="mt-6 space-y-3 text-[14.5px] text-slateDark font-medium">
              <li className="flex items-start gap-2.5">
                <span className="w-5 h-5 rounded-md bg-emerald-50 text-greenMedical flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold">✓</span>
                <span>Keeps working through network drops and power blackouts.</span>
              </li>
              <li className="flex items-start gap-2.5">

                <div className="p-6">
