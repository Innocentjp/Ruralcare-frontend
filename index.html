<body class="bg-white text-slateDark font-sans selection:bg-greenMedical selection:text-white">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
gsap.registerPlugin(ScrollTrigger);

const AUTH_URL = 'auth.html';

const navigateAuth = (target) => {
  try {
    sessionStorage.setItem('ruralcare_next', target);
  } catch(e) {}
  window.location.href = `${AUTH_URL}?next=${encodeURIComponent(target)}`;
};

function App() {
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [vitals, setVitals] = useState({ sys: '164', dia: '102', temp: '37.1', spo2: '94' });
  const [triageOutput, setTriageOutput] = useState({ level: 'CRITICAL', label: 'Critical Urgency', flags: [] });

  const rootRef = useRef(null);
  const heroTextRef = useRef(null);

  const assess = (s, d, t, o) => {
    const systolic = parseInt(s, 10);
    const diastolic = parseInt(d, 10);
    const temperature = parseFloat(t);
    const oxygen = parseInt(o, 10);

    let level = 'NORMAL';
    let label = 'Normal Thresholds';
    const flags = [];

    if (oxygen && oxygen < 92) {
      level = 'CRITICAL';
      label = 'Critical Urgency';
      flags.push('SpO2 below 92% (Severe Hypoxia risk)');
    } else if (oxygen && oxygen < 95) {
      if (level !== 'CRITICAL') { level = 'REVIEW'; label = 'Needs Review'; }
      flags.push('SpO2 borderline (92-94%)');
    }

    if (systolic && diastolic) {
      if (systolic >= 160 || diastolic >= 100) {
        level = 'CRITICAL';
        label = 'Critical Urgency';
        flags.push('Blood pressure in Hypertensive Crisis range (≥ 160/100 mmHg)');
      } else if (systolic >= 140 || diastolic >= 90) {
        if (level !== 'CRITICAL') { level = 'REVIEW'; label = 'Needs Review'; }
        flags.push('Stage 2 Hypertension range (≥ 140/90 mmHg)');
      }
    }

    if (temperature && temperature >= 39.0) {
      level = 'CRITICAL';
      label = 'Critical Urgency';
      flags.push('High-grade fever (≥ 39.0 °C)');
    } else if (temperature && temperature >= 38.0) {
      if (level !== 'CRITICAL') { level = 'REVIEW'; label = 'Needs Review'; }
      flags.push('Febrile reading recorded (≥ 38.0 °C)');
    }

    if (flags.length === 0) {
      flags.push('Readings are within stable baseline limits');
    }

    setTriageOutput({ level, label, flags });
  };

  useEffect(() => {
    assess(vitals.sys, vitals.dia, vitals.temp, vitals.spo2);
  }, [vitals]);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();

    const ctx = gsap.context(() => {
      gsap.from(heroTextRef.current.children, {
        y: 40,
        opacity: 0,
        duration: 0.85,
        stagger: 0.15,
        ease: 'power3.out'
      });

      gsap.utils.toArray('.reveal-up').forEach((elem) => {
        gsap.from(elem, {
          scrollTrigger: {
            trigger: elem,
            start: 'top 88%'
          },
          y: 35,
          opacity: 0,
          duration: 0.75,
          ease: 'power3.out'
        });
      });
    }, rootRef);

    return () => ctx.revert();
  }, []);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [mobileMenuOpen, triageOutput]);

  return (
    <div ref={rootRef} className="min-h-screen flex flex-col bg-white">
      
      <header className="fixed top-0 inset-x-0 z-50 bg-white border-b border-slate-100 shadow-sm">
        <div className="w-full px-5 sm:px-10 lg:px-16 h-20 flex items-center justify-between">
          
          <a href="index.html" className="flex items-center gap-2.5">
            <img 
              src="img/logo-icon-color.png" 
              alt="RuralCare" 
              className="h-8 w-auto object-contain logo-transparent" 
            />
          </a>

          <nav className="hidden lg:flex items-center gap-8 text-[14px] font-bold text-slateDark">
            <a href="#how" className="hover:text-greenMedical transition-colors">How It Works</a>
            <a href="#ward" className="hover:text-greenMedical transition-colors">On The Ward</a>
            <a href="#roles" className="hover:text-greenMedical transition-colors">Frontline Roles</a>
            <a href="#features" className="hover:text-greenMedical transition-colors">Capabilities</a>
            <a href="#simulator" className="hover:text-greenMedical transition-colors">Live Simulator</a>
            <a href="#protocols" className="hover:text-greenMedical transition-colors">Protocols</a>
            <a href="#faq" className="hover:text-greenMedical transition-colors">FAQ</a>
          </nav>

          <div className="hidden sm:flex items-center gap-4">
            <button 
              onClick={() => navigateAuth('dashboard.html')} 
              className="text-[14px] font-bold text-slateDark hover:text-greenMedical px-3 py-2 transition-colors"
            >
              Sign In
            </button>
            <button 
              onClick={() => navigateAuth('intake.html')} 
              className="h-11 px-6 rounded-xl bg-greenMedical hover:bg-slateDark text-white text-[14px] font-bold flex items-center gap-2 shadow-md shadow-greenMedical/20 transition-all hover:-translate-y-0.5 active:translate-y-0"
            >
              <i data-lucide="plus-circle" className="w-4 h-4"></i>
              <span>Patient Intake</span>
            </button>
          </div>

          <button 
            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
            className="lg:hidden w-11 h-11 rounded-xl border border-slateDark/15 flex items-center justify-center text-slateDark"
            aria-label="Toggle Navigation"
          >
            <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-5 h-5"></i>
          </button>
        </div>

        {mobileMenuOpen && (
          <div className="lg:hidden px-6 pt-3 pb-6 bg-white border-b border-slate-100 flex flex-col gap-3 font-bold text-[15px] shadow-xl">
            <a href="#how" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">How It Works</a>
            <a href="#ward" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">On The Ward</a>
            <a href="#roles" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">Frontline Roles</a>
            <a href="#features" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">Capabilities</a>
            <a href="#simulator" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">Live Simulator</a>
            <a href="#protocols" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">Protocols</a>
            <a href="#faq" onClick={() => setMobileMenuOpen(false)} className="py-2.5 text-left text-slateDark border-b border-slate-50">FAQ</a>
            <div className="pt-2 flex flex-col gap-2">
              <button onClick={() => navigateAuth('dashboard.html')} className="w-full h-12 flex items-center justify-center rounded-xl border-2 border-slateDark text-slateDark font-bold">

              </button>
              <button onClick={() => navigateAuth('intake.html')} className="w-full h-12 flex items-center justify-center rounded-xl bg-greenMedical text-white font-bold">

              </button>
            </div>

      </header>

      <section className="relative min-h-[680px] lg:min-h-[760px] flex items-center pt-28 pb-20 px-5 sm:px-10 lg:px-16 overflow-hidden">
        <div className="absolute inset-0">
          <img

          <div className="absolute inset-0 bg-gradient-to-r from-slateDark/95 via-slateDark/85 to-slateDark/60"></div>
        </div>

        <div className="relative z-10 max-w-7xl mx-auto w-full">
          <div ref={heroTextRef} className="max-w-2xl text-white">
            
            <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-greenMedical text-[12px] font-extrabold uppercase tracking-wider mb-6">
              <span className="w-2 h-2 rounded-full bg-greenMedical animate-pulse"></span>

            </div>

            <h1 className="font-extrabold text-[40px] sm:text-[54px] lg:text-[64px] leading-[1.06] tracking-tight text-white">
              Triage that keeps moving when the <span className="text-greenMedical">signal drops.</span>
            </h1>

            <p className="mt-6 text-[17px] sm:text-[19px] leading-relaxed text-white/85 font-medium max-w-xl">
              Engineered for clinicians facing connectivity blackouts in lead-lined radiology suites, basement labs, and rural wards. Capture vitals locally, trigger instant clinical flags, and background-sync once reconnected.
            </p>

            <div className="mt-8 flex flex-wrap items-center gap-4 w-full sm:w-auto">
              <button 
                onClick={() => navigateAuth('dashboard.html')} 
                className="h-14 px-8 rounded-xl bg-greenMedical hover:bg-white hover:text-slateDark text-white font-bold text-[15px] flex items-center justify-center gap-3 shadow-xl transition-all hover:-translate-y-0.5 w-full sm:w-auto"
              >
                <span>Access Clinical Queue</span>
                <i data-lucide="arrow-right" className="w-4 h-4"></i>
              </button>
              <button 
                onClick={() => navigateAuth('intake.html')} 
                className="h-14 px-8 rounded-xl border-2 border-white/80 hover:bg-white hover:text-slateDark text-white font-bold text-[15px] flex items-center justify-center gap-2 transition-all w-full sm:w-auto backdrop-blur-sm"
              >
                <span>Start Bedside Intake</span>
              </button>
            </div>

            <div className="mt-12 pt-8 border-t border-white/15 grid grid-cols-3 gap-6 max-w-lg">
              <div>
                <p className="font-extrabold text-2xl sm:text-3xl text-white">100%</p>
                <p className="text-[12px] font-bold text-white/70 uppercase tracking-wider mt-0.5">Offline-First</p>
              </div>
              <div>
                <p className="font-extrabold text-2xl sm:text-3xl text-greenMedical">&lt; 0.1s</p>
                <p className="text-[12px] font-bold text-white/70 uppercase tracking-wider mt-0.5">Local Triage</p>
              </div>
              <div>
                <p className="font-extrabold text-2xl sm:text-3xl text-white">Zero Loss</p>
                <p className="text-[12px] font-bold text-white/70 uppercase tracking-wider mt-0.5">Cached Sync</p>
              </div>
            </div>

          </div>
        </div>
      </section>

      <section id="how" className="py-20 sm:py-28 bg-surfaceLight border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-5 sm:px-10 lg:px-16">
          
          <div className="max-w-2xl">

            <h2 className="mt-4 font-extrabold text-3xl sm:text-4xl text-slateDark tracking-tight">

              Eliminate paper delays, handwritten registers, and backlog transcription errors.
            </p>
          </div>

          <div className="mt-14 grid sm:grid-cols-3 gap-8">
            <div className="reveal-up p-8 rounded-3xl bg-white border border-slate-200/80 shadow-sm flex flex-col justify-between">
              <div>
                <span className="font-mono text-[14px] font-extrabold text-greenMedical">STEP 01</span>
                <h3 className="mt-4 font-extrabold text-xl text-slateDark">Capture & Record</h3>

                  Log patient demographics, vitals, and symptoms. Dictate clinical observations hands-free using on-device voice processing.
                </p>
              </div>
              <div className="mt-6 pt-4 border-t border-slate-100 flex items-center gap-2 text-[12px] font-bold text-slateDark/60">
                <i data-lucide="database" className="w-4 h-4 text-greenMedical"></i>
                <span>Stored in IndexedDB instantly</span>
              </div>
            </div>

            <div className="reveal-up p-8 rounded-3xl bg-white border border-slate-200/80 shadow-sm flex flex-col justify-between">
              <div>
                <span className="font-mono text-[14px] font-extrabold text-greenMedical">STEP 02</span>
                <h3 className="mt-4 font-extrabold text-xl text-slateDark">Instant Triage Flags</h3>
                <p className="mt-2.5 text-slateDark/70 text-[14px] leading-relaxed font-medium">
                  The clinical insight engine checks inputs against age-adjusted baseline thresholds, sorting patients into Urgent, Review, and Clear.
                </p>
              </div>
              <div className="mt-6 pt-4 border-t border-slate-100 flex items-center gap-2 text-[12px] font-bold text-slateDark/60">
                <i data-lucide="shield-alert" className="w-4 h-4 text-greenMedical"></i>
                <span>Zero server latency</span>
              </div>
            </div>

            <div className="reveal-up p-8 rounded-3xl bg-white border border-slate-200/80 shadow-sm flex flex-col justify-between">
              <div>
                <span className="font-mono text-[14px] font-extrabold text-greenMedical">STEP 03</span>
                <h3 className="mt-4 font-extrabold text-xl text-slateDark">Sync & Refer</h3>
                <p className="mt-2.5 text-slateDark/70 text-[14px] leading-relaxed font-medium">
                  Auto-sync pushes queued records when Wi-Fi returns. 1-tap referral sheets generate transfer briefs ready for tertiary hospital handoffs.
                </p>
              </div>
              <div className="mt-6 pt-4 border-t border-slate-100 flex items-center gap-2 text-[12px] font-bold text-slateDark/60">
                <i data-lucide="refresh-cw" className="w-4 h-4 text-greenMedical"></i>

              </div>
            </div>
          </div>

        </div>

      <section id="ward" className="py-20 sm:py-28 bg-white border-b border-slate-100">

          <div className="reveal-up lg:col-span-6">
            <div className="rounded-3xl overflow-hidden border border-slate-200 shadow-xl">
              <img 
                src="./img/ward-tablet.jpg" 
                alt="Health worker reviewing digital records on a ward tablet"

              />
            </div>
          </div>

          <div className="lg:col-span-6 flex flex-col items-start">
            <span className="text-[12px] font-extrabold uppercase tracking-wider text-greenMedical bg-emerald-50 px-3.5 py-1.5 rounded-full border border-greenMedical/20">

            </span>
            <h2 className="mt-4 font-extrabold text-3xl sm:text-4xl text-slateDark tracking-tight">

            </h2>
            <p className="mt-3 text-slateDark/75 text-[16px] font-medium leading-relaxed">

            </p>

            <ul className="mt-6 space-y-3.5 text-[15px] font-bold text-slateDark">
              <li className="flex items-start gap-3">
                <span className="w-5 h-5 rounded-full bg-emerald-50 text-greenMedical flex items-center justify-center shrink-0 mt-0.5">✓</span>
                <span>Keeps working through network drops and power blackouts.</span>
              </li>
              <li className="flex items-start gap-3">
