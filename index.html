const assess = ({ sys, dia, temp, spo2 }) => {
  const s = parseInt(sys, 10);
  const d = parseInt(dia, 10);
  const t = parseFloat(temp);
  const o = parseInt(spo2, 10);

  let level = 'NORMAL';
  const flags = [];

  if (o && o < 92) {
    level = 'CRITICAL';
    flags.push('SpO2 below 92%');
  } else if (o && o < 95) {
    if (level !== 'CRITICAL') level = 'REVIEW';
    flags.push('SpO2 is borderline');
  }

  if (s && d) {
    if (s >= 160 || d >= 100) {
      level = 'CRITICAL';
      flags.push('Blood pressure in the hypertensive crisis range');
    } else if (s >= 140 || d >= 90) {
      if (level !== 'CRITICAL') level = 'REVIEW';
      flags.push('Blood pressure at stage 2 or above');
    }
  }

  if (t && t >= 39.0) {
    level = 'CRITICAL';
    flags.push('Temperature at or above 39.0 °C');
  } else if (t && t >= 38.0) {
    if (level !== 'CRITICAL') level = 'REVIEW';
    flags.push('Fever recorded');
  }

  if (flags.length === 0) flags.push('No flags raised for these readings');

  return { level, flags };
};
