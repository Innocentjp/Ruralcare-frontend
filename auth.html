<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | RuralCare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#52B788">
<link rel="apple-touch-icon" href="./img/icon-192.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./img/icon-192.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<style>
/* Suppress native browser duplicate password reveal buttons */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
input[type="password"]::-webkit-credentials-auto-fill-button {
  visibility: hidden !important;
  pointer-events: none !important;
  position: absolute !important;
  right: 0 !important;
}
.otp-digit {
  width: 46px;
  height: 52px;
  text-align: center;
  font-size: 1.25rem;
  font-weight: 700;
  border-radius: 0.75rem;
  border: 1.5px solid #E2E8F0;
  background: #FFFFFF;
  color: #141A29;
  transition: all 0.15s ease;
}
.otp-digit:focus {
  outline: none;
  border-color: #52B788;
  box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.2);
}
</style>
</head>
<body class="antialiased text-[#141A29] bg-[#F7F9FC] min-h-screen">

  <div class="min-h-screen flex flex-col items-center justify-center px-5 py-10">

    <div class="brand-block mb-8 flex justify-center">
      <img src="./img/logo-full-color.png" alt="RuralCare" class="h-28 sm:h-32 w-auto object-contain">
    </div>

    <div class="w-full sm:max-w-[420px] bg-white border border-[#E5E7EB] rounded-2xl shadow-sm p-7 sm:p-9">

      <div class="text-center mb-7">
        <h1 id="form-title" class="text-[22px] font-bold tracking-tight text-[#141A29]">Sign in to your workspace</h1>
        <p id="form-subtitle" class="text-[13px] text-[#64748B] mt-2 leading-relaxed">Access clinical records for your clinic or care team.</p>
      </div>

      <!-- STEP 1: CREDENTIALS FORM -->
      <form id="auth-form" class="space-y-4" novalidate>

        <div id="signup-fields" class="space-y-4 hidden">
          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Full name & Title</label>
            <div class="relative flex items-center">
              <i data-lucide="user" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="full-name" placeholder="Dr. Innocent Ebisike" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>
          
          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Role</label>
            <div class="relative flex items-center w-full">
              <select id="role" class="w-full h-[46px] bg-white border border-[#E2E8F0] rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                <option value="" disabled selected>Select your role</option>
                <option value="Community Health Worker (CHEW)">Community Health Worker (CHEW)</option>
                <option value="Medical Officer">Medical Officer</option>
                <option value="Physiotherapist">Physiotherapist</option>
                <option value="Nurse / Midwife">Nurse / Midwife</option>
                <option value="NGO / Program Supervisor">NGO / Program Supervisor</option>
                <option value="Clinic Administrator">Clinic Administrator</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Practicing License No. / Facility ID</label>
            <div class="relative flex items-center">
              <i data-lucide="shield-check" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="license-no" placeholder="e.g. MDCN, NMCN, MRTBN or PHC-042" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Clinic / organization</label>
            <div class="relative flex items-center">
              <i data-lucide="building-2" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="clinic" placeholder="Rural Health Unit" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">State</label>
              <div class="relative flex items-center w-full">
                <select id="state" class="w-full h-[46px] bg-white border border-[#E2E8F0] rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                  <option value="Enugu" selected>Enugu</option>
                  <option value="Lagos">Lagos</option>
                  <option value="Anambra">Anambra</option>
                  <option value="Oyo">Oyo</option>
                  <option value="Rivers">Rivers</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
            <div>
              <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">LGA / District</label>
              <div class="relative flex items-center w-full">
                <select id="lga" class="w-full h-[46px] bg-white border border-[#E2E8F0] rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]"></select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Email address</label>
          <div class="relative flex items-center">
            <i data-lucide="mail" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="email" id="email" autocomplete="email" placeholder="jane.doe@example.org" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div>
          <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Password</label>
          <div class="relative flex items-center">
            <i data-lucide="lock" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            <button type="button" id="toggle-pw" class="absolute right-3.5 text-[#94A3B8]" aria-label="Toggle password visibility"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div id="signup-extra-fields" class="space-y-4 hidden">
          <div class="space-y-1.5">
            <div class="flex gap-1" id="strength-bars">
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
            </div>
            <p id="strength-label" class="text-[11px] text-[#64748B] font-medium">Password must be at least 8 characters</p>
          </div>

          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Confirm password</label>
            <div class="relative flex items-center">
              <i data-lucide="rotate-ccw" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="password" id="confirm-password" autocomplete="new-password" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
              <button type="button" id="toggle-confirm-pw" class="absolute right-3.5 text-[#94A3B8]" aria-label="Toggle confirm password visibility"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <label class="flex items-start gap-2.5 pt-1 cursor-pointer">
            <input type="checkbox" id="terms" class="mt-0.5 w-4 h-4 rounded border-[#CBD5E1] accent-[#52B788]">
            <span class="text-[12px] text-[#64748B] font-medium leading-relaxed">
              I agree to the <a href="#" class="text-[#52B788] font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-[#52B788] font-semibold hover:underline">Privacy Policy</a>.
            </span>
          </label>
        </div>

        <div id="signin-extra-fields" class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-[#CBD5E1] accent-[#52B788]">
            <span class="text-[13px] font-medium text-[#64748B]">Remember me for 30 days</span>
          </label>
          <button type="button" id="forgot-pw-btn" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors">Forgot password?</button>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 text-[15px] font-semibold text-white bg-[#52B788] hover:bg-[#43A073] active:scale-[0.99] rounded-xl shadow-sm transition-all flex justify-center items-center gap-2 mt-2 disabled:opacity-60 disabled:cursor-not-allowed">
          Sign In
        </button>

        <p id="form-error" class="hidden text-[12px] font-semibold text-[#DC2626] text-center bg-red-50 border border-red-200 rounded-xl px-3 py-2.5"></p>

        <div id="secure-badge" class="mt-2 bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl p-3.5 flex items-start gap-2.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-[#52B788] mt-0.5 shrink-0"></i>
          <p class="text-[11.5px] text-[#15803D] font-medium leading-relaxed">Protected by local PBKDF2-SHA256 encryption, per-clinician workspace isolation &amp; 2FA verification.</p>
        </div>
      </form>

      <!-- STEP 2: 2FA / SECURITY CODE VERIFICATION -->
      <form id="otp-form" class="space-y-5 hidden" novalidate>
        <div class="bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl p-3.5">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start gap-2.5">
              <i data-lucide="key-round" class="w-4 h-4 text-[#15803D] mt-0.5 shrink-0"></i>
              <div>
                <p class="text-[12px] font-bold text-[#15803D]">2FA Security Code Dispatched</p>
                <p class="text-[11.5px] text-[#166534] mt-0.5">Demo Code for <span id="otp-target-email" class="font-semibold underline"></span>:</p>
              </div>
            </div>
            <button type="button" id="autofill-otp-btn" class="shrink-0 text-[11px] font-bold bg-[#15803D] text-white px-2.5 py-1 rounded-lg hover:bg-[#166534] transition-colors">
              Auto-fill
            </button>
          </div>
          <div class="mt-2.5 flex items-center justify-center bg-white/90 border border-[#BBF7D0] rounded-lg py-1.5 px-3">
            <span id="demo-otp-display" class="font-mono text-[18px] font-extrabold tracking-[0.25em] text-[#141A29]">------</span>
          </div>
        </div>

        <div>
          <label class="block text-[12.5px] font-semibold text-[#141A29] text-center mb-3">Enter 6-digit verification code</label>
          <div class="flex items-center justify-between gap-1.5 sm:gap-2" id="otp-inputs">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp-idx="0" aria-label="Digit 1">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp-idx="1" aria-label="Digit 2">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp-idx="2" aria-label="Digit 3">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp-idx="3" aria-label="Digit 4">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp-idx="4" aria-label="Digit 5">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp-idx="5" aria-label="Digit 6">
          </div>
          <p id="otp-error" class="hidden text-[12px] font-semibold text-[#DC2626] text-center mt-2.5 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></p>
        </div>

        <button type="submit" id="verify-otp-btn" class="w-full py-3.5 text-[15px] font-semibold text-white bg-[#52B788] hover:bg-[#43A073] active:scale-[0.99] rounded-xl shadow-sm transition-all flex justify-center items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
          <i data-lucide="shield-check" class="w-4 h-4"></i>
          <span>Verify &amp; Enter Workspace</span>
        </button>

        <div class="flex items-center justify-between pt-1 text-[12.5px]">
          <button type="button" id="back-to-login-btn" class="font-semibold text-[#64748B] hover:text-[#141A29] flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Back</span>
          </button>
          <button type="button" id="resend-otp-btn" class="font-semibold text-[#52B788] hover:text-[#3d9169]">
            Resend new code
          </button>
        </div>
      </form>

    </div>

    <div id="auth-footer-toggle" class="mt-6 text-center">
      <span id="toggle-text" class="text-[13px] font-medium text-[#64748B]">Don't have an account?</span>
      <button id="toggle-auth" type="button" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors ml-1">Create one</button>
    </div>
  </div>

  <script src="js/index.js"></script>
  <script>
    lucide.createIcons();

    // If user already has an active, valid session, redirect to dashboard
    if (typeof RC !== 'undefined' && RC.getCurrentUser()) {
      const urlParams = new URLSearchParams(window.location.search);
      const nextTarget = urlParams.get('next') || sessionStorage.getItem('ruralcare_next') || 'dashboard.html';
      sessionStorage.removeItem('ruralcare_next');
      window.location.replace(nextTarget);
    }

    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const authForm = document.getElementById('auth-form');
    const otpForm = document.getElementById('otp-form');
    const authFooterToggle = document.getElementById('auth-footer-toggle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');
    const toggleAuth = document.getElementById('toggle-auth');
    const signupFields = document.getElementById('signup-fields');
    const signupExtraFields = document.getElementById('signup-extra-fields');
    const signinExtraFields = document.getElementById('signin-extra-fields');
    const secureBadge = document.getElementById('secure-badge');
    const formError = document.getElementById('form-error');
    const stateSelect = document.getElementById('state');
    const lgaSelect = document.getElementById('lga');
    const emailInput = document.getElementById('email');
    const rememberCheckbox = document.getElementById('remember');

    const otpInputs = Array.from(document.querySelectorAll('.otp-digit'));
    const otpError = document.getElementById('otp-error');
    const demoOtpDisplay = document.getElementById('demo-otp-display');
    const otpTargetEmail = document.getElementById('otp-target-email');

    const geoData = {
      Enugu: ["Enugu North", "Nsukka", "Enugu South", "Awgu", "Udi"],
      Lagos: ["Ikeja", "Lagos Island", "Alimosho", "Eti-Osa", "Surulere"],
      Anambra: ["Awka South", "Onitsha North", "Nnewi North", "Ihiala", "Aguata"],
      Oyo: ["Ibadan North", "Ogbomosho North", "Oyo East", "Akinyele", "Iseyin"],
      Rivers: ["Port Harcourt", "Obio-Akpor", "Bonny", "Eleme", "Ikwerre"]
    };

    function updateLGAs() {
      const selectedState = stateSelect.value;
      const lgas = geoData[selectedState] || [];
      lgaSelect.innerHTML = lgas.map(lga => `<option value="${lga}">${lga}</option>`).join('');
    }

    stateSelect.addEventListener('change', updateLGAs);
    updateLGAs();

    // Pre-fill remembered email if present
    const rememberedEmail = RC.getRememberedEmail ? RC.getRememberedEmail() : '';
    if (rememberedEmail) {
      emailInput.value = rememberedEmail;
      rememberCheckbox.checked = true;
    }

    let isSignUp = false;
    let pendingAuthUser = null;
    let pendingRememberMe = false;
    let lockoutTimer = null;

    function clearErrors() {
      document.querySelectorAll('.field-error-text').forEach(e => { e.classList.add('hidden'); e.textContent = ''; });
      document.querySelectorAll('.input-field').forEach(e => e.classList.remove('field-error'));
      formError.classList.add('hidden');
      otpError.classList.add('hidden');
    }

    function showFieldError(id, message) {
      const field = document.getElementById(id);
      if (!field) return;
      field.classList.add('field-error');
      const p = field.closest('div').parentElement.querySelector('.field-error-text') || field.parentElement.parentElement.querySelector('.field-error-text');
      if (p) { p.textContent = message; p.classList.remove('hidden'); }
    }

    function showFormError(message) {
      formError.textContent = message;
      formError.classList.remove('hidden');
    }

    function startLockoutCountdown(ms) {
      clearInterval(lockoutTimer);
      let remaining = Math.ceil(ms / 1000);
      submitBtn.disabled = true;

      const tick = () => {
        if (remaining <= 0) {
          clearInterval(lockoutTimer);
          submitBtn.disabled = false;
          submitBtn.innerHTML = isSignUp ? 'Create Account' : 'Sign In';
          formError.classList.add('hidden');
          return;
        }
        const mins = Math.floor(remaining / 60);
        const secs = String(remaining % 60).padStart(2, '0');
        submitBtn.innerHTML = `<i data-lucide="shield-alert" class="w-4 h-4"></i><span>Locked (${mins}:${secs})</span>`;
        showFormError(`Too many failed attempts. Security rate limit active — please wait ${mins}:${secs}.`);
        lucide.createIcons();
        remaining--;
      };
      tick();
      lockoutTimer = setInterval(tick, 1000);
    }

    function renderMode() {
      clearInterval(lockoutTimer);
      submitBtn.disabled = false;
      otpForm.classList.add('hidden');
      authForm.classList.remove('hidden');
      authFooterToggle.classList.remove('hidden');

      if (isSignUp) {
        formTitle.textContent = 'Create your account';
        formSubtitle.textContent = 'Register to manage clinical records securely.';
        submitBtn.innerHTML = 'Create Account';
        toggleText.textContent = 'Already have an account?';
        toggleAuth.textContent = 'Sign in';
        signupFields.classList.remove('hidden');
        signupExtraFields.classList.remove('hidden');
        signinExtraFields.classList.add('hidden');
        secureBadge.classList.remove('hidden');
      } else {
        formTitle.textContent = 'Sign in to your workspace';
        formSubtitle.textContent = 'Access clinical records for your clinic or care team.';
        submitBtn.innerHTML = 'Sign In';
        toggleText.textContent = "Don't have an account?";
        toggleAuth.textContent = 'Create one';
        signupFields.classList.add('hidden');
        signupExtraFields.classList.add('hidden');
        signinExtraFields.classList.remove('hidden');
        secureBadge.classList.remove('hidden');
      }
      clearErrors();
      lucide.createIcons();
    }

    function showOtpStep(user, remember) {
      pendingAuthUser = user;
      pendingRememberMe = remember;
      const challenge = RC.issueOtpChallenge(user.email);

      authForm.classList.add('hidden');
      authFooterToggle.classList.add('hidden');
      otpForm.classList.remove('hidden');

      formTitle.textContent = 'Two-Factor Verification';
      formSubtitle.textContent = 'Enter the 6-digit security code to unlock your clinical workspace.';
      otpTargetEmail.textContent = user.email;
      demoOtpDisplay.textContent = challenge.code;
      otpInputs.forEach(input => { input.value = ''; });
      otpError.classList.add('hidden');
      setTimeout(() => otpInputs[0].focus(), 60);
      lucide.createIcons();
    }

    // OTP input navigation & paste handling
    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val ? val[0] : '';
        if (val && idx < otpInputs.length - 1) {
          otpInputs[idx + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          otpInputs[idx - 1].focus();
        }
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        if (!pasted) return;
        pasted.split('').forEach((ch, i) => {
          if (otpInputs[i]) otpInputs[i].value = ch;
        });
        const focusIdx = Math.min(pasted.length, otpInputs.length - 1);
        otpInputs[focusIdx].focus();
      });
    });

    document.getElementById('autofill-otp-btn').addEventListener('click', () => {
      const code = (demoOtpDisplay.textContent || '').replace(/\D/g, '');
      if (code.length === 6) {
        code.split('').forEach((ch, i) => { otpInputs[i].value = ch; });
        otpForm.requestSubmit();
      }
    });

    document.getElementById('resend-otp-btn').addEventListener('click', () => {
      if (!pendingAuthUser) return;
      const challenge = RC.issueOtpChallenge(pendingAuthUser.email);
      demoOtpDisplay.textContent = challenge.code;
      otpInputs.forEach(input => { input.value = ''; });
      otpError.classList.add('hidden');
      otpInputs[0].focus();
    });

    document.getElementById('back-to-login-btn').addEventListener('click', () => {
      pendingAuthUser = null;
      renderMode();
    });

    otpForm.addEventListener('submit', (e) => {
      e.preventDefault();
      otpError.classList.add('hidden');
      if (!pendingAuthUser) return;

      const entered = otpInputs.map(i => i.value).join('');
      if (entered.length !== 6) {
        otpError.textContent = 'Please enter all 6 digits of your verification code.';
        otpError.classList.remove('hidden');
        return;
      }

      const verifyRes = RC.verifyOtpChallenge(pendingAuthUser.email, entered);
      if (!verifyRes.ok) {
        otpError.textContent = verifyRes.error || 'Invalid verification code.';
        otpError.classList.remove('hidden');
        if (verifyRes.lockoutMs) {
          renderMode();
          startLockoutCountdown(verifyRes.lockoutMs);
        }
        return;
      }

      // Finalize session & seed default demo patients for this user
      RC.startSession(pendingAuthUser, pendingRememberMe);
      RC.seedIfEmpty();

      const verifyBtn = document.getElementById('verify-otp-btn');
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Opening Workspace...</span>';
      lucide.createIcons();

      const urlParams = new URLSearchParams(window.location.search);
      const nextTarget = urlParams.get('next') || sessionStorage.getItem('ruralcare_next') || 'dashboard.html';
      sessionStorage.removeItem('ruralcare_next');

      setTimeout(() => { window.location.replace(nextTarget); }, 350);
    });

    toggleAuth.addEventListener('click', () => { isSignUp = !isSignUp; renderMode(); });

    document.getElementById('forgot-pw-btn').addEventListener('click', () => {
      const email = emailInput.value.trim().toLowerCase();
      if (!email) {
        showFieldError('email', 'Enter your registered email address first.');
        return;
      }
      const existing = RC.findUser(email);
      if (!existing) {
        showFormError('No account found for this email address.');
        return;
      }
      showFormError('For offline security, contact your clinic administrator or sign in with your registered password.');
    });

    document.getElementById('toggle-pw').addEventListener('click', (e) => {
      const pw = document.getElementById('password');
      const icon = e.currentTarget.querySelector('i');
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      icon.setAttribute('data-lucide', show ? 'eye' : 'eye-off');
      lucide.createIcons();
    });

    document.getElementById('toggle-confirm-pw').addEventListener('click', (e) => {
      const pw = document.getElementById('confirm-password');
      const icon = e.currentTarget.querySelector('i');
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      icon.setAttribute('data-lucide', show ? 'eye' : 'eye-off');
      lucide.createIcons();
    });

    const strengthBars = () => document.querySelectorAll('#strength-bars > div');
    const strengthLabel = document.getElementById('strength-label');
    document.getElementById('password').addEventListener('input', (e) => {
      const val = e.target.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const colors = ['#E2E8F0', '#DC2626', '#F59E0B', '#52B788', '#389E68'];
      const labels = ['Password must be at least 8 characters', 'Weak password', 'Fair password', 'Good password', 'Strong password'];
      strengthBars().forEach((bar, i) => { bar.style.background = i < score ? colors[score] : '#E2E8F0'; });
      strengthLabel.textContent = val.length === 0 ? labels[0] : labels[score];
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      let valid = true;

      const email = emailInput.value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        showFieldError('email', 'Enter a valid email address.');
        valid = false;
      }

      // Check rate limit before processing
      const rateStatus = RC.checkRateLimit(email);
      if (rateStatus.locked) {
        startLockoutCountdown(rateStatus.remainingMs);
        return;
      }

      if (!password || password.length < (isSignUp ? 8 : 1)) {
        showFieldError('password', isSignUp ? 'Password must be at least 8 characters.' : 'Enter your password.');
        valid = false;
      }

      if (isSignUp) {
        const name = document.getElementById('full-name').value.trim();
        const clinic = document.getElementById('clinic').value.trim();
        const role = document.getElementById('role').value;
        const licenseNo = document.getElementById('license-no').value.trim();
        const state = stateSelect.value;
        const lga = lgaSelect.value;
        const confirm = document.getElementById('confirm-password').value;
        const terms = document.getElementById('terms').checked;
        
        if (!name) { showFieldError('full-name', 'Full name is required.'); valid = false; }
        if (!role) { showFieldError('role', 'Select your role.'); valid = false; }
        if (!clinic) { showFieldError('clinic', 'Clinic is required.'); valid = false; }
        if (confirm !== password || !confirm) { showFieldError('confirm-password', 'Passwords do not match.'); valid = false; }
        if (!terms) { showFormError('Please accept the Terms of Service to continue.'); valid = false; }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Encrypting account...</span>';
        lucide.createIcons();

        const regResult = await RC.registerUser({
          name, role, clinic, licenseNo, state, lga, email, password
        });

        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
        lucide.createIcons();

        if (!regResult.ok) {
          if (regResult.code === 'exists') {
            showFieldError('email', regResult.error);
          } else {
            showFormError(regResult.error || 'Could not create account.');
          }
          return;
        }

        showOtpStep(regResult.user, true);
      } else {
        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Verifying credentials...</span>';
        lucide.createIcons();

        const authResult = await RC.authenticate(email, password);

        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
        lucide.createIcons();

        if (!authResult.ok) {
          if (authResult.code === 'locked') {
            startLockoutCountdown(authResult.remainingMs || 120000);
            return;
          }
          if (authResult.code === 'not-found') {
            showFieldError('email', authResult.error);
          } else if (authResult.code === 'bad-password') {
            showFieldError('password', authResult.error);
          } else {
            showFormError(authResult.error || 'Sign in failed.');
          }
          return;
        }

        showOtpStep(authResult.user, rememberCheckbox.checked);
      }
    });

    renderMode();
  </script>
</body>
</html>
