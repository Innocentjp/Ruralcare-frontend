<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Sign In | RuralCare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#52B788">
<link rel="apple-touch-icon" href="./img/icon-192.png">

<link rel="icon" href="./img/icon-192.png" type="image/png">

input[type="password"]::-ms-clear {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
input[type="password"]::-webkit-credentials-auto-fill-button {
  visibility: hidden !important;
  pointer-events: none !important;
  position: absolute !important;
  right: 0 !important;
}
.field-error {
  border-color: #DC2626 !important;
}
.field-error:focus {
  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
}
.auth-pending {
  visibility: hidden;
}
</style>
</head>
<body class="antialiased text-[#141A29] bg-[#F7F9FC] min-h-screen">

  <div id="auth-shell" class="auth-pending min-h-screen flex flex-col items-center justify-center px-5 py-10">

    <div class="brand-block mb-8 flex justify-center">
      <img src="./img/logo-full-color.png" alt="RuralCare" class="h-28 sm:h-32 w-auto object-contain">
    </div>

    <div class="w-full sm:max-w-[420px] bg-white border border-[#E5E7EB] rounded-2xl shadow-sm p-7 sm:p-9">

      <div class="text-center mb-7">
        <h1 id="form-title" class="text-[22px] font-bold tracking-tight text-[#141A29]">Sign in to your workspace</h1>
        <p id="form-subtitle" class="text-[13px] text-[#64748B] mt-2 leading-relaxed">Access clinical records for your clinic or care team.</p>
      </div>

      <p id="form-success" class="hidden mb-4 bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl p-3 text-[12px] font-semibold text-[#15803D] text-center" role="status"></p>

      <form id="auth-form" class="space-y-4" novalidate>

        <div id="signup-fields" class="space-y-4 hidden">
          <div data-field>
            <label for="full-name" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Full name &amp; Title</label>
            <div class="relative flex items-center">
              <i data-lucide="user" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="full-name" autocomplete="name" maxlength="80" aria-required="true" placeholder="Dr. Innocent Ebisike" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div data-field>
            <label for="role" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Role</label>
            <div class="relative flex items-center w-full">
              <select id="role" aria-required="true" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                <option value="" disabled selected>Select your role</option>
                <option value="Community Health Worker (CHEW)">Community Health Worker (CHEW)</option>
                <option value="Medical Officer">Medical Officer</option>
                <option value="Physiotherapist">Physiotherapist</option>
                <option value="Nurse / Midwife">Nurse / Midwife</option>
                <option value="NGO / Program Supervisor">NGO / Program Supervisor</option>
                <option value="Clinic Administrator">Clinic Administrator</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div data-field>
            <label for="license-no" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Practicing License No. / Facility ID</label>
            <div class="relative flex items-center">
              <i data-lucide="shield-check" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="license-no" autocomplete="off" maxlength="40" aria-required="true" placeholder="e.g. MDCN, NMCN, MRTBN or PHC-042" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div data-field>
            <label for="clinic" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Clinic / organization</label>
            <div class="relative flex items-center">
              <i data-lucide="building-2" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="clinic" autocomplete="organization" maxlength="120" aria-required="true" placeholder="Rural Health Unit" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div data-field>
              <label for="state" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">State</label>
              <div class="relative flex items-center w-full">
                <select id="state" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                  <option value="Enugu" selected>Enugu</option>
                  <option value="Lagos">Lagos</option>
                  <option value="Anambra">Anambra</option>
                  <option value="Oyo">Oyo</option>
                  <option value="Rivers">Rivers</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
            <div data-field>
              <label for="lga" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">LGA / District</label>
              <div class="relative flex items-center w-full">
                <select id="lga" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]"></select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
          </div>
        </div>

        <div id="email-wrap" data-field>
          <label for="email" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Email address</label>
          <div class="relative flex items-center">
            <i data-lucide="mail" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="email" id="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" aria-required="true" placeholder="jane.doe@example.org" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div id="password-wrap" data-field>
          <label id="password-label" for="password" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Password</label>
          <div class="relative flex items-center">
            <i data-lucide="lock" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" aria-required="true" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            <button type="button" id="toggle-pw" aria-label="Show password" aria-pressed="false" class="absolute right-3.5 text-[#94A3B8] cursor-pointer"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div id="strength-wrap" class="space-y-1.5 hidden">
          <div class="flex gap-1" id="strength-bars">
            <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
            <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
            <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
            <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
          </div>
          <p id="strength-label" class="text-[11px] text-[#64748B] font-medium" aria-live="polite">Use at least 8 characters with letters and numbers</p>
        </div>

        <div id="confirm-wrap" data-field class="hidden">
          <label for="confirm-password" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Confirm password</label>
          <div class="relative flex items-center">
            <i data-lucide="rotate-ccw" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" maxlength="128" aria-required="true" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            <button type="button" id="toggle-confirm-pw" aria-label="Show password" aria-pressed="false" class="absolute right-3.5 text-[#94A3B8] cursor-pointer"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <label id="terms-wrap" class="flex items-start gap-2.5 pt-1 cursor-pointer hidden">
          <input type="checkbox" id="terms" class="mt-0.5 w-4 h-4 rounded border-[#CBD5E1]">
          <span class="text-[12px] text-[#64748B] font-medium leading-relaxed">
            I agree to the <a href="terms.html" target="_blank" rel="noopener" class="text-[#52B788] font-semibold hover:underline">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener" class="text-[#52B788] font-semibold hover:underline">Privacy Policy</a>.
          </span>
        </label>

        <div id="signin-extra-fields" class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-[#CBD5E1]">
            <span class="text-[13px] font-medium text-[#64748B]">Remember me</span>
          </label>
          <button type="button" id="forgot-link" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors cursor-pointer">Forgot password?</button>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 text-[15px] font-semibold text-white bg-[#52B788] hover:bg-[#43A073] active:scale-[0.99] rounded-xl shadow-sm transition-all flex justify-center items-center gap-2 mt-2 disabled:opacity-60 disabled:cursor-not-allowed">
          Sign In
        </button>

        <p id="form-error" class="form-level-error hidden text-[12px] font-semibold text-[#DC2626] text-center" role="alert"></p>
      </form>
    </div>

    <div id="switch-row" class="mt-6 text-center">
      <span id="toggle-text" class="text-[13px] font-medium text-[#64748B]">Don't have an account?</span>
      <button type="button" id="toggle-auth" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors ml-1 cursor-pointer">Create one</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const SUPABASE_URL = 'https://rjlyoimpsamugszhsjii.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8FgHA9dB8n4nn2--FHmNUQ_FY0H-dAL';
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

    const KEYS = {
      next: 'ruralcare_next',
      remember: 'rcauth_remember',
      loop: 'rcauth_redirects',
      sessionOnly: 'rcauth_session_only'
    };

    const SESSION_COOKIE = 'rc_active';

    const initialHash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    let recoveryFlow = initialHash.get('type') === 'recovery';
    const linkError = initialHash.get('error_description');

    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');
    const toggleAuth = document.getElementById('toggle-auth');
    const formError = document.getElementById('form-error');
    const formSuccess = document.getElementById('form-success');
    const stateSelect = document.getElementById('state');
    const lgaSelect = document.getElementById('lga');
    const roleSelect = document.getElementById('role');
    const authForm = document.getElementById('auth-form');
    const pwInput = document.getElementById('password');
    const confirmPwInput = document.getElementById('confirm-password');
    const emailInput = document.getElementById('email');
    const passwordLabel = document.getElementById('password-label');
    const rememberBox = document.getElementById('remember');
    const termsBox = document.getElementById('terms');
    const togglePw = document.getElementById('toggle-pw');
    const toggleConfirmPw = document.getElementById('toggle-confirm-pw');

    const BLOCK_IDS = ['signup-fields', 'email-wrap', 'password-wrap', 'strength-wrap', 'confirm-wrap', 'terms-wrap', 'signin-extra-fields', 'switch-row'];

    const MODES = {
      signin: {
        title: 'Sign in to your workspace',
        subtitle: 'Access clinical records for your clinic or care team.',
        button: 'Sign In',
        busy: 'Signing in…',
        docTitle: 'Sign In',
        switchText: "Don't have an account?",
        switchLabel: 'Create one',
        switchTo: 'signup',
        show: ['email-wrap', 'password-wrap', 'signin-extra-fields', 'switch-row']
      },
      signup: {
        title: 'Create your account',
        subtitle: 'Register to manage clinical records securely.',
        button: 'Create Account',
        busy: 'Creating account…',
        docTitle: 'Create Account',
        switchText: 'Already have an account?',
        switchLabel: 'Sign in',
        switchTo: 'signin',
        show: ['signup-fields', 'email-wrap', 'password-wrap', 'strength-wrap', 'confirm-wrap', 'terms-wrap', 'switch-row']
      },
      forgot: {
        title: 'Reset your password',
        subtitle: 'Enter your email and we will send you a reset link.',
        button: 'Send reset link',
        busy: 'Sending link…',
        docTitle: 'Reset Password',
        switchText: 'Remembered your password?',
        switchLabel: 'Sign in',
        switchTo: 'signin',
        show: ['email-wrap', 'switch-row']
      },
      reset: {
        title: 'Set a new password',
        subtitle: 'Choose a strong password for your account.',
        button: 'Update password',
        busy: 'Updating…',
        docTitle: 'New Password',
        switchText: '',
        switchLabel: '',
        switchTo: 'signin',
        show: ['password-wrap', 'strength-wrap', 'confirm-wrap']
      }
    };

    const geoData = {
      Enugu: ["Enugu North", "Nsukka", "Enugu South", "Awgu", "Udi"],
      Lagos: ["Ikeja", "Lagos Island", "Alimosho", "Eti-Osa", "Surulere"],
      Anambra: ["Awka South", "Onitsha North", "Nnewi North", "Ihiala", "Aguata"],
      Oyo: ["Ibadan North", "Ogbomosho North", "Oyo East", "Akinyele", "Iseyin"],
      Rivers: ["Port Harcourt", "Obio-Akpor", "Bonny", "Eleme", "Ikwerre"]
    };

    let mode = 'signin';
    let busy = false;
    let firstErrorField = null;

    function safeGet(area, key) {
      try { return window[area].getItem(key); } catch (e) { return null; }
    }

    function safeSet(area, key, value) {
      try { window[area].setItem(key, value); } catch (e) {}
    }

    function safeRemove(area, key) {
      try { window[area].removeItem(key); } catch (e) {}
    }

    function updateLGAs() {
      const lgas = geoData[stateSelect.value] || [];
      lgaSelect.innerHTML = lgas.map(lga => `<option value="${lga}">${lga}</option>`).join('');
    }

    stateSelect.addEventListener('change', updateLGAs);
    updateLGAs();

    function normEmail(v) { return String(v || '').trim().toLowerCase(); }
    function validEmail(v) { return v.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
    function clean(v, max) { return String(v || '').replace(/[<>\u0000-\u001F\u007F]/g, '').replace(/\s+/g, ' ').trim().slice(0, max); }

    function passwordIssue(pw) {
      if (pw.length < 8) return 'Password must be at least 8 characters.';
      if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Use a mix of letters and numbers.';
      return null;
    }

    function safeNext(raw) {
      if (!raw || typeof raw !== 'string') return null;
      if (!/^[A-Za-z0-9_\-.\/?=&%]+$/.test(raw)) return null;
      if (raw.startsWith('//') || raw.includes('..')) return null;
      if (/auth\.html/i.test(raw)) return null;
      return raw;
    }

    function consumeNext() {
      const stored = safeGet('sessionStorage', KEYS.next);
      safeRemove('sessionStorage', KEYS.next);
      const fromUrl = new URLSearchParams(window.location.search).get('next');
      return safeNext(stored) || safeNext(fromUrl) || 'dashboard.html';
    }

    function redirectUrl() {
      return window.location.origin + window.location.pathname;
    }

    function sessionCookieActive() {
      return document.cookie.split('; ').some(c => c === SESSION_COOKIE + '=1');
    }

    function startBrowserSession() {
      const secure = window.location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = SESSION_COOKIE + '=1; path=/; SameSite=Lax' + secure;
      return sessionCookieActive();
    }

    function applyRememberChoice(email, remember) {
      if (remember) {
        safeSet('localStorage', KEYS.remember, email);
        safeRemove('localStorage', KEYS.sessionOnly);
        return;
      }
      safeRemove('localStorage', KEYS.remember);
      if (startBrowserSession()) safeSet('localStorage', KEYS.sessionOnly, '1');
      else safeRemove('localStorage', KEYS.sessionOnly);
    }

    function browserSessionExpired() {
      return safeGet('localStorage', KEYS.sessionOnly) === '1' && !sessionCookieActive();
    }

    function readRedirects() {
      let list = [];
      try { list = JSON.parse(safeGet('sessionStorage', KEYS.loop) || '[]'); } catch (e) { list = []; }
      if (!Array.isArray(list)) list = [];
      const now = Date.now();
      return list.filter(t => typeof t === 'number' && now - t < 10000);
    }

    function recordRedirect() {
      const list = readRedirects();
      list.push(Date.now());
      safeSet('sessionStorage', KEYS.loop, JSON.stringify(list));
    }

    function redirectLoopDetected() {
      return readRedirects().length >= 2;
    }

    function isAuthRejection(error) {
      if (!error) return false;
      const codes = ['session_not_found', 'user_not_found', 'bad_jwt', 'invalid_jwt', 'session_expired'];
      return error.name === 'AuthSessionMissingError' || [401, 403, 404].includes(error.status) || codes.includes(error.code);
    }

    function revealShell() {
      const shell = document.getElementById('auth-shell');
      if (shell) shell.classList.remove('auth-pending');
    }

    function setVisible(el, on) {
      if (el) el.classList.toggle('hidden', !on);
    }

    function updateStrengthUI(val) {
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const colors = ['#E2E8F0', '#DC2626', '#F59E0B', '#52B788', '#389E68'];
      const labels = ['Use at least 8 characters with letters and numbers', 'Weak password', 'Fair password', 'Good password', 'Strong password'];
      document.querySelectorAll('#strength-bars > div').forEach((bar, i) => {
        bar.style.background = val.length > 0 && i < score ? colors[score] : '#E2E8F0';
      });
      document.getElementById('strength-label').textContent = val.length === 0 ? labels[0] : labels[score];
    }

    function setReveal(input, btn, show) {
      input.type = show ? 'text' : 'password';
      btn.innerHTML = `<i data-lucide="${show ? 'eye' : 'eye-off'}" class="w-4 h-4"></i>`;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      lucide.createIcons();
    }

    function setBusy(on) {
      busy = on;
      submitBtn.disabled = on;
      authForm.setAttribute('aria-busy', on ? 'true' : 'false');
      if (on) {
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span></span>';
        submitBtn.querySelector('span').textContent = MODES[mode].busy;
      } else {
        submitBtn.textContent = MODES[mode].button;
      }
      lucide.createIcons();
    }

    function clearFieldError(field) {
      field.classList.remove('field-error');
      field.removeAttribute('aria-invalid');
      field.removeAttribute('aria-describedby');
      const wrap = field.closest('[data-field]');
      const p = wrap && wrap.querySelector('.field-error-text');
      if (p) {
        p.classList.add('hidden');
        p.textContent = '';
      }
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(clearFieldError);
      document.querySelectorAll('.field-error-text').forEach(p => {
        p.classList.add('hidden');
        p.textContent = '';
      });
      formError.replaceChildren();
      formError.classList.add('hidden');
      formSuccess.textContent = '';
      formSuccess.classList.add('hidden');
      firstErrorField = null;
    }

    function showFieldError(id, message) {
      const field = document.getElementById(id);
      if (!field) return;
      field.classList.add('field-error');
      field.setAttribute('aria-invalid', 'true');
      const wrap = field.closest('[data-field]');
      const p = wrap && wrap.querySelector('.field-error-text');
      if (p) {
        p.textContent = message;
        p.classList.remove('hidden');
        if (!p.id) p.id = id + '-error';
        field.setAttribute('aria-describedby', p.id);
      }
      if (!firstErrorField) firstErrorField = field;
    }

    function markInvalid(id) {
      const field = document.getElementById(id);
      if (!field) return;
      field.classList.add('field-error');
      field.setAttribute('aria-invalid', 'true');
      if (!firstErrorField) firstErrorField = field;
    }

    function focusFirstError() {
      if (firstErrorField) firstErrorField.focus();
    }

    function showFormError(message) {
      formError.replaceChildren();
      formError.textContent = message;
      formError.classList.remove('hidden');
    }

    function showSuccess(message) {
      formSuccess.textContent = message;
      formSuccess.classList.remove('hidden');
    }

    function describeError(error) {
      if (error) console.error('[auth]', error);
      const msg = String((error && error.message) || '').toLowerCase();
      if (!navigator.onLine || (error && error.name === 'AuthRetryableFetchError')) {
        return 'Unable to reach the server. Check your connection and try again.';
      }
      if ((error && error.status === 429) || /rate limit|too many/.test(msg)) {
        return 'Too many attempts. Please wait a few minutes and try again.';
      }
      return 'Something went wrong. Please try again.';
    }

    function syncUrl() {
      const params = new URLSearchParams(window.location.search);
      params.delete('signup');
      if (mode === 'signup') params.set('signup', 'true');
      const qs = params.toString();
      history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    }

    function setMode(next) {
      mode = next;
      const cfg = MODES[next];
      formTitle.textContent = cfg.title;
      formSubtitle.textContent = cfg.subtitle;
      document.title = cfg.docTitle + ' | RuralCare';
      BLOCK_IDS.forEach(id => setVisible(document.getElementById(id), cfg.show.includes(id)));
      toggleText.textContent = cfg.switchText;
      toggleAuth.textContent = cfg.switchLabel;
      passwordLabel.textContent = next === 'reset' ? 'New password' : 'Password';
      pwInput.autocomplete = next === 'signin' ? 'current-password' : 'new-password';
      emailInput.autocomplete = next === 'signin' ? 'username' : 'email';
      pwInput.value = '';
      confirmPwInput.value = '';
      setReveal(pwInput, togglePw, false);
      setReveal(confirmPwInput, toggleConfirmPw, false);
      updateStrengthUI('');
      if (next === 'signin' && !emailInput.value) {
        const remembered = safeGet('localStorage', KEYS.remember);
        if (remembered) {
          emailInput.value = remembered;
          rememberBox.checked = true;
        }
      }
      clearErrors();
      setBusy(false);
      syncUrl();
      lucide.createIcons();
    }

    function showUnconfirmed(email) {
      formError.replaceChildren();
      formError.append('Please confirm your email address before signing in. ');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'underline font-bold';
      btn.textContent = 'Resend confirmation email';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const { error } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: redirectUrl() } });
          clearErrors();
          if (error) showFormError(describeError(error));
          else showSuccess('Confirmation email sent. Check your inbox and spam folder.');
        } catch (err) {
          clearErrors();
          showFormError(describeError(err));
        }
      });
      formError.append(btn);
      formError.classList.remove('hidden');
    }

    function showAlreadyExists() {
      showFieldError('email', 'An account already exists with this email address. Try signing in.');
    }

    async function handleSignIn() {
      const email = normEmail(emailInput.value);
      const password = pwInput.value;
      let valid = true;

      if (!validEmail(email)) { showFieldError('email', 'Enter a valid email address.'); valid = false; }
      if (!password) { showFieldError('password', 'Enter your password.'); valid = false; }
      if (!valid) { focusFirstError(); return; }

      setBusy(true);
      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        setBusy(false);
        const msg = String(error.message || '').toLowerCase();
        if (error.code === 'email_not_confirmed' || msg.includes('email not confirmed')) {
          showUnconfirmed(email);
          return;
        }
        if (error.code === 'invalid_credentials' || msg.includes('invalid login credentials')) {
          markInvalid('email');
          markInvalid('password');
          showFormError('Incorrect email or password.');
          pwInput.value = '';
          pwInput.focus();
          return;
        }
        showFormError(describeError(error));
        return;
      }

      applyRememberChoice(email, rememberBox.checked);

      recordRedirect();
      window.location.replace(consumeNext());
    }

    async function handleSignUp() {
      const name = clean(document.getElementById('full-name').value, 80);
      const role = roleSelect.value;
      const licenseNo = clean(document.getElementById('license-no').value, 40);
      const clinic = clean(document.getElementById('clinic').value, 120);
      const state = stateSelect.value;
      const lga = lgaSelect.value;
      const email = normEmail(emailInput.value);
      const password = pwInput.value;
      const confirm = confirmPwInput.value;
      let valid = true;

      if (name.length < 2) { showFieldError('full-name', 'Full name is required.'); valid = false; }
      if (!role) { showFieldError('role', 'Select your role.'); valid = false; }
      if (licenseNo.length < 3) { showFieldError('license-no', 'Enter your license number or facility ID.'); valid = false; }
      if (!clinic) { showFieldError('clinic', 'Clinic or organization is required.'); valid = false; }
      if (!validEmail(email)) { showFieldError('email', 'Enter a valid email address.'); valid = false; }
      const issue = passwordIssue(password);
      if (issue) { showFieldError('password', issue); valid = false; }
      if (!confirm || confirm !== password) { showFieldError('confirm-password', 'Passwords do not match.'); valid = false; }
      if (!termsBox.checked) { showFormError('Please accept the Terms of Service and Privacy Policy to continue.'); valid = false; }
      if (!valid) { focusFirstError(); return; }

      setBusy(true);
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { name, role, clinic, licenseNo, state, lga },
          emailRedirectTo: redirectUrl()
        }
      });

      if (error) {
        setBusy(false);
        const msg = String(error.message || '').toLowerCase();
        if (error.code === 'user_already_exists' || msg.includes('already registered')) {
          showAlreadyExists();
        } else if (error.code === 'weak_password' || msg.includes('password should')) {
          showFieldError('password', 'Choose a stronger password.');
        } else {
          showFormError(describeError(error));
        }
        focusFirstError();
        return;
      }

      const identities = data && data.user && data.user.identities;
      if (Array.isArray(identities) && identities.length === 0) {
        setBusy(false);
        showAlreadyExists();
        focusFirstError();
        return;
      }

      if (data && data.session) {
        safeRemove('localStorage', KEYS.sessionOnly);
        recordRedirect();
        window.location.replace(consumeNext());
        return;
      }

      setMode('signin');
      emailInput.value = email;
      showSuccess('Account created. We sent a confirmation link to ' + email + '. Confirm your email, then sign in.');
    }

    async function handleForgot() {
      const email = normEmail(emailInput.value);
      if (!validEmail(email)) {
        showFieldError('email', 'Enter a valid email address.');
        focusFirstError();
        return;
      }

      setBusy(true);
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
      setBusy(false);

      if (error) {
        showFormError(describeError(error));
        return;
      }
      showSuccess('If an account exists for that email, a password reset link is on its way. Check your inbox and spam folder.');
    }

    async function handleReset() {
      const password = pwInput.value;
      const confirm = confirmPwInput.value;
      let valid = true;

      const issue = passwordIssue(password);
      if (issue) { showFieldError('password', issue); valid = false; }
      if (!confirm || confirm !== password) { showFieldError('confirm-password', 'Passwords do not match.'); valid = false; }
      if (!valid) { focusFirstError(); return; }

      setBusy(true);
      const { error } = await sb.auth.updateUser({ password });

      if (error) {
        setBusy(false);
        const msg = String(error.message || '').toLowerCase();
        if (error.code === 'same_password' || msg.includes('different from the old password')) {
          showFieldError('password', 'New password must be different from your current password.');
        } else if (error.code === 'weak_password' || msg.includes('password should')) {
          showFieldError('password', 'Choose a stronger password.');
        } else if (msg.includes('session')) {
          recoveryFlow = false;
          setMode('forgot');
          showFormError('This reset link has expired. Request a new one.');
        } else {
          showFormError(describeError(error));
        }
        focusFirstError();
        return;
      }

      await sb.auth.signOut();
      recoveryFlow = false;
      setMode('signin');
      showSuccess('Password updated. Sign in with your new password.');
    }

    toggleAuth.addEventListener('click', (e) => {
      e.preventDefault();
      if (busy) return;
      setMode(MODES[mode].switchTo);
    });

    document.getElementById('forgot-link').addEventListener('click', () => {
      if (busy) return;
      setMode('forgot');
    });

    togglePw.addEventListener('click', () => {
      setReveal(pwInput, togglePw, pwInput.type === 'password');
    });

    toggleConfirmPw.addEventListener('click', () => {
      setReveal(confirmPwInput, toggleConfirmPw, confirmPwInput.type === 'password');
    });

    pwInput.addEventListener('input', (e) => {
      updateStrengthUI(e.target.value);
    });

    authForm.addEventListener('input', (e) => {
      if (e.target.classList && e.target.classList.contains('field-error')) clearFieldError(e.target);
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;
      clearErrors();

      if (!sb) {
        showFormError('Unable to load authentication. Check your connection and refresh the page.');
        return;
      }

      const handlers = { signin: handleSignIn, signup: handleSignUp, forgot: handleForgot, reset: handleReset };
      try {
        await handlers[mode]();
      } catch (err) {
        setBusy(false);
        showFormError(describeError(err));
      }
    });

    if (sb) {
      sb.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
          recoveryFlow = true;
          if (mode !== 'reset') setMode('reset');
        }
      });
    }

    setTimeout(revealShell, 3000);

    (async function boot() {
      const params = new URLSearchParams(window.location.search);
      const next = safeNext(params.get('next'));
      if (next) safeSet('sessionStorage', KEYS.next, next);

      if (linkError) {
        setMode('signin');
        showFormError('This link is invalid or has expired. Sign in, or use "Forgot password?" to request a new link.');
      } else if (recoveryFlow) {
        setMode('reset');
      } else {
        setMode(params.get('signup') === 'true' ? 'signup' : 'signin');
      }

      if (!sb) {
        showFormError('Unable to load authentication. Check your connection and refresh the page.');
        revealShell();
        return;
      }

      let session = null;
      try {
        const res = await sb.auth.getSession();
        session = res.data.session;
      } catch (e) {
        session = null;
      }

      if (recoveryFlow) {
        if (!session) {
          recoveryFlow = false;
          setMode('forgot');
          showFormError('This reset link has expired. Request a new one.');
        }
        revealShell();
        return;
      }

      if (!session) {
        revealShell();
        return;
      }

      if (browserSessionExpired()) {
        safeRemove('localStorage', KEYS.sessionOnly);
        try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
        revealShell();
        return;
      }

      if (redirectLoopDetected()) {
        safeRemove('sessionStorage', KEYS.loop);
        safeRemove('sessionStorage', KEYS.next);
        try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
        showFormError('We could not open your workspace. Please sign in again.');
        revealShell();
        return;
      }

      let sessionInvalid = false;
      try {
        const { data, error } = await sb.auth.getUser();
        if (error) sessionInvalid = isAuthRejection(error);
        else if (!(data && data.user)) sessionInvalid = true;
      } catch (e) {
        sessionInvalid = false;
      }

      if (sessionInvalid) {
        try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
        revealShell();
        return;
      }

      recordRedirect();
      window.location.replace(consumeNext());
    })();
  </script>
</body>
</html>
