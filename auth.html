<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#52B788">
<link rel="apple-touch-icon" href="./img/icon-192.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./img/icon-192.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<style>
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear { display: none; }
  input::-webkit-credentials-auto-fill-button { visibility: hidden; pointer-events: none; position: absolute; right: 0; }
</style>
</head>
<body class="antialiased text-[#141A29] bg-[#F7F9FC] min-h-screen">

  <div class="min-h-screen flex flex-col items-center justify-center px-5 py-10">

    <div class="brand-block mb-8 flex justify-center">
      <img src="./img/logo-full-color.png" alt="RuralCare" class="h-28 sm:h-32 w-auto object-contain">
    </div>

    <div class="w-full sm:max-w-[420px] bg-white border border-[#E5E7EB] rounded-2xl shadow-sm p-7 sm:p-9">

      <div class="text-center mb-7">
        <h1 id="form-title" class="text-[22px] font-bold tracking-tight text-[#141A29]">Sign in to your workspace</h1>
        <p id="form-subtitle" class="text-[13px] text-[#64748B] mt-2 leading-relaxed">Access clinical records for your clinic or care team.</p>
      </div>

      <form id="auth-form" class="space-y-4" novalidate>

        <div id="signup-fields" class="space-y-4 hidden">
          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Full name</label>
            <div class="relative flex items-center">
              <i data-lucide="user" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="full-name" placeholder="Dr. Jane Doe" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>
          
          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Role</label>
            <div class="relative flex items-center w-full">
              <select id="role" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                <option value="" disabled selected>Select your role</option>
                <option value="Community Health Worker (CHEW)">Community Health Worker (CHEW)</option>
                <option value="Medical Officer">Medical Officer</option>
                <option value="Physiotherapist">Physiotherapist</option>
                <option value="Nurse / Midwife">Nurse / Midwife</option>
                <option value="NGO / Program Supervisor">NGO / Program Supervisor</option>
                <option value="Clinic Administrator">Clinic Administrator</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Practicing License No. / Facility ID</label>
            <div class="relative flex items-center">
              <i data-lucide="shield-check" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="license-no" placeholder="e.g. MDCN, NMCN, MRTBN or PHC-042" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Clinic / organization</label>
            <div class="relative flex items-center">
              <i data-lucide="building-2" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="clinic" placeholder="Rural Health Unit" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">State</label>
              <div class="relative flex items-center w-full">
                <select id="state" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                  <option value="Enugu" selected>Enugu</option>
                  <option value="Lagos">Lagos</option>
                  <option value="Anambra">Anambra</option>
                  <option value="Oyo">Oyo</option>
                  <option value="Rivers">Rivers</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
            <div>
              <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">LGA / District</label>
              <div class="relative flex items-center w-full">
                <select id="lga" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]"></select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Email address</label>
          <div class="relative flex items-center">
            <i data-lucide="mail" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="email" id="email" placeholder="jane.doe@example.org" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div>
          <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Password</label>
          <div class="relative flex items-center">
            <i data-lucide="lock" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            <button type="button" id="toggle-pw" aria-label="Show password" aria-pressed="false" class="absolute right-3.5 text-[#94A3B8] hover:text-[#64748B] transition-colors"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
          </div>
          <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div id="signup-extra-fields" class="space-y-4 hidden">
          <div class="space-y-1.5">
            <div class="flex gap-1" id="strength-bars">
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
            </div>
            <p id="strength-label" aria-live="polite" class="text-[11px] text-[#64748B] font-medium">Password must be at least 8 characters</p>
          </div>

          <div>
            <label class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Confirm password</label>
            <div class="relative flex items-center">
              <i data-lucide="rotate-ccw" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="password" id="confirm-password" autocomplete="new-password" placeholder="••••••••" class="input-field pl-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label class="flex items-start gap-2.5 pt-1 cursor-pointer">
              <input type="checkbox" id="terms" class="mt-0.5 w-4 h-4 rounded border-[#CBD5E1] text-[#52B788] focus:ring-[#52B788]">
              <span class="text-[12px] text-[#64748B] font-medium leading-relaxed">
                I agree to the <a href="#" data-legal class="text-[#52B788] font-semibold hover:underline">Terms of Service</a> and <a href="#" data-legal class="text-[#52B788] font-semibold hover:underline">Privacy Policy</a>.
              </span>
            </label>
            <p id="terms-error" role="alert" class="hidden text-[11px] font-semibold text-[#DC2626] mt-1.5"></p>
          </div>
        </div>

        <div id="signin-extra-fields" class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-[#CBD5E1] text-[#52B788] focus:ring-[#52B788]">
            <span class="text-[13px] font-medium text-[#64748B]">Remember me</span>
          </label>
          <a href="#" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 text-[15px] font-semibold text-white bg-[#52B788] hover:bg-[#43A073] active:scale-[0.99] rounded-xl shadow-sm transition-all flex justify-center items-center gap-2 mt-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
          Sign In
        </button>

        <p id="form-error" class="hidden text-[12px] font-semibold text-[#DC2626] text-center"></p>

        <div id="secure-badge" class="mt-2 bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl p-3.5 flex items-start gap-2.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-[#52B788] mt-0.5 shrink-0"></i>
          <p class="text-[11.5px] text-[#15803D] font-medium leading-relaxed">Your data stays secure and syncs automatically once you're back online.</p>
        </div>
      </form>
    </div>

    <div class="mt-6 text-center">
      <span id="toggle-text" class="text-[13px] font-medium text-[#64748B]">Don't have an account?</span>
      <button id="toggle-auth" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors ml-1">Create one</button>
    </div>
  </div>

  <script src="js/index.js"></script>
  <script>
    lucide.createIcons();

    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');
    const toggleAuth = document.getElementById('toggle-auth');
    const signupFields = document.getElementById('signup-fields');
    const signupExtraFields = document.getElementById('signup-extra-fields');
    const signinExtraFields = document.getElementById('signin-extra-fields');
    const secureBadge = document.getElementById('secure-badge');
    const formError = document.getElementById('form-error');
    const stateSelect = document.getElementById('state');
    const lgaSelect = document.getElementById('lga');
    const termsBox = document.getElementById('terms');
    const termsError = document.getElementById('terms-error');
    const pwInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    let submitting = false;

    function safeNext(v) {
      return v && /^[A-Za-z0-9_\-]+\.html(\?[A-Za-z0-9_\-=&%.]*)?$/.test(v) ? v : '';
    }

    function resolveNext() {
      const fromUrl = safeNext(new URLSearchParams(window.location.search).get('next'));
      let fromStore = '';
      try { fromStore = safeNext(sessionStorage.getItem('ruralcare_next')); } catch (e) {}
      return fromUrl || fromStore || 'dashboard.html';
    }

    if (RC.getCurrentUser()) {
      window.location.replace(resolveNext());
    }

    const geoData = {
      Enugu: ["Enugu North", "Nsukka", "Enugu South", "Awgu", "Udi"],
      Lagos: ["Ikeja", "Lagos Island", "Alimosho", "Eti-Osa", "Surulere"],
      Anambra: ["Awka South", "Onitsha North", "Nnewi North", "Ihiala", "Aguata"],
      Oyo: ["Ibadan North", "Ogbomosho North", "Oyo East", "Akinyele", "Iseyin"],
      Rivers: ["Port Harcourt", "Obio-Akpor", "Bonny", "Eleme", "Ikwerre"]
    };

    function updateLGAs() {
      const selectedState = stateSelect.value;
      const lgas = geoData[selectedState] || [];
      lgaSelect.innerHTML = lgas.map(lga => `<option value="${lga}">${lga}</option>`).join('');
    }

    stateSelect.addEventListener('change', updateLGAs);
    updateLGAs();

    let isSignUp = false;

    function clearErrors() {
      document.querySelectorAll('.field-error-text').forEach(e => { e.classList.add('hidden'); e.textContent = ''; });
      document.querySelectorAll('.input-field').forEach(e => e.classList.remove('field-error'));
      formError.classList.add('hidden');
      formError.textContent = '';
      termsError.classList.add('hidden');
      termsError.textContent = '';
    }

    function showFormError(message) {
      formError.textContent = message;
      formError.classList.remove('hidden');
    }

    function showTermsError() {
      termsError.textContent = 'You must agree to the Terms of Service and Privacy Policy to create an account.';
      termsError.classList.remove('hidden');
    }

    function syncSubmitState() {
      submitBtn.disabled = submitting || (isSignUp && !termsBox.checked);
    }

    function setLoading(on) {
      submitting = on;
      if (on) submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
      else submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
      syncSubmitState();
      lucide.createIcons();
    }

    function showFieldError(id, message) {
      const field = document.getElementById(id);
      field.classList.add('field-error');
      const p = field.closest('div').parentElement.querySelector('.field-error-text') || field.parentElement.parentElement.querySelector('.field-error-text');
      if (p) { p.textContent = message; p.classList.remove('hidden'); }
    }

    function renderMode() {
      if (isSignUp) {
        formTitle.textContent = 'Create your account';
        formSubtitle.textContent = 'Register to manage clinical records securely.';
        submitBtn.textContent = 'Create Account';
        pwInput.setAttribute('autocomplete', 'new-password');
        toggleText.textContent = 'Already have an account?';
        toggleAuth.textContent = 'Sign in';
        signupFields.classList.remove('hidden');
        signupExtraFields.classList.remove('hidden');
        signinExtraFields.classList.add('hidden');
        secureBadge.classList.remove('hidden');
      } else {
        formTitle.textContent = 'Sign in to your workspace';
        formSubtitle.textContent = 'Access clinical records for your clinic or care team.';
        submitBtn.textContent = 'Sign In';
        pwInput.setAttribute('autocomplete', 'current-password');
        toggleText.textContent = "Don't have an account?";
        toggleAuth.textContent = 'Create one';
        signupFields.classList.add('hidden');
        signupExtraFields.classList.add('hidden');
        signinExtraFields.classList.remove('hidden');
        secureBadge.classList.add('hidden');
      }
      clearErrors();
      setPwVisible(false);
      updateStrength();
      syncSubmitState();
      lucide.createIcons();
    }

    toggleAuth.addEventListener('click', () => { isSignUp = !isSignUp; renderMode(); });
    termsBox.addEventListener('change', () => {
      if (termsBox.checked) { termsError.classList.add('hidden'); termsError.textContent = ''; }
      syncSubmitState();
    });
    document.querySelectorAll('[data-legal]').forEach(a => a.addEventListener('click', e => e.preventDefault()));

    function setPwVisible(visible) {
      pwInput.type = visible ? 'text' : 'password';
      confirmInput.type = visible ? 'text' : 'password';
      const btn = document.getElementById('toggle-pw');
      btn.innerHTML = '<i data-lucide="' + (visible ? 'eye' : 'eye-off') + '" class="w-4 h-4"></i>';
      btn.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      btn.setAttribute('aria-pressed', String(visible));
      lucide.createIcons();
    }

    document.getElementById('toggle-pw').addEventListener('click', () => {
      setPwVisible(pwInput.type === 'password');
    });

    const strengthBars = () => document.querySelectorAll('#strength-bars > div');
    const strengthLabel = document.getElementById('strength-label');

    function updateStrength() {
      const val = pwInput.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const colors = ['#E2E8F0', '#DC2626', '#F59E0B', '#52B788', '#389E68'];
      const textColors = ['#64748B', '#DC2626', '#B45309', '#15803D', '#15803D'];
      const labels = ['Password must be at least 8 characters', 'Weak password', 'Fair password', 'Good password', 'Strong password'];
      strengthBars().forEach((bar, i) => { bar.style.background = i < score ? colors[score] : '#E2E8F0'; });
      if (val.length === 0) {
        strengthLabel.textContent = labels[0];
        strengthLabel.style.color = textColors[0];
      } else if (val.length < 8) {
        strengthLabel.textContent = 'Too short: use at least 8 characters';
        strengthLabel.style.color = textColors[1];
      } else {
        strengthLabel.textContent = labels[score];
        strengthLabel.style.color = textColors[score];
      }
    }

    pwInput.addEventListener('input', updateStrength);

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitting) return;
      clearErrors();
      let valid = true;

      const email = document.getElementById('email').value.trim();
      const password = pwInput.value;

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) { showFieldError('email', 'Enter a valid email address.'); valid = false; }
      if (!password || password.length < (isSignUp ? 8 : 1)) { showFieldError('password', isSignUp ? 'Password must be at least 8 characters.' : 'Enter your password.'); valid = false; }

      let profile = null;
      if (isSignUp) {
        const name = document.getElementById('full-name').value.trim();
        const clinic = document.getElementById('clinic').value.trim();
        const role = document.getElementById('role').value;
        const licenseNo = document.getElementById('license-no').value.trim();

        if (!name) { showFieldError('full-name', 'Full name is required.'); valid = false; }
        if (!role) { showFieldError('role', 'Select your role.'); valid = false; }
        if (!clinic) { showFieldError('clinic', 'Clinic is required.'); valid = false; }
        if (!confirmInput.value || confirmInput.value !== password) { showFieldError('confirm-password', 'Passwords do not match.'); valid = false; }
        if (!termsBox.checked) { showTermsError(); valid = false; }

        profile = { email, password, name, clinic, role, licenseNo, state: stateSelect.value, lga: lgaSelect.value };
      }

      if (!valid) return;

      setLoading(true);
      let result;
      try {
        result = isSignUp ? await RC.registerUser(profile) : await RC.authenticate(email, password);
      } catch (err) {
        result = { ok: false, code: 'error', error: 'Something went wrong. Please try again.' };
      }

      if (!result.ok) {
        setLoading(false);
        if (result.code === 'exists' || result.code === 'not-found' || result.code === 'invalid') showFieldError('email', result.error);
        else if (result.code === 'bad-password') showFieldError('password', result.error);
        else showFormError(result.error);
        return;
      }

      RC.startSession(result.user);
      try { sessionStorage.removeItem('ruralcare_next'); } catch (err) {}
      const target = resolveNext();
      setTimeout(() => { window.location.href = target; }, 300);
    });

    renderMode();
  </script>
</body>
</html>
