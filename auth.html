<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Sign In</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#52B788">
<link rel="apple-touch-icon" href="./img/icon-192.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./img/icon-192.png" type="image/png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://unpkg.com/lucide@0.294.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<style>
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
input[type="password"]::-webkit-credentials-auto-fill-button {
  visibility: hidden !important;
  pointer-events: none !important;
  position: absolute !important;
  right: 0 !important;
}
</style>
</head>
<body class="antialiased text-[#141A29] bg-[#F7F9FC] min-h-screen">

  <div class="min-h-screen flex flex-col items-center justify-center px-5 py-10">

    <div class="brand-block mb-8 flex justify-center">
      <img src="./img/logo-full-color.png" alt="RuralCare" class="h-28 sm:h-32 w-auto object-contain">
    </div>

    <div class="w-full sm:max-w-[420px] bg-white border border-[#E5E7EB] rounded-2xl shadow-sm p-7 sm:p-9">

      <div class="text-center mb-7">
        <h1 id="form-title" class="text-[22px] font-bold tracking-tight text-[#141A29]">Sign in to your workspace</h1>
        <p id="form-subtitle" class="text-[13px] text-[#64748B] mt-2 leading-relaxed">Access clinical records for your clinic or care team.</p>
      </div>

      <p id="form-success" class="hidden mb-4 bg-[#F0FDF4] border border-[#BBF7D0] rounded-xl p-3 text-[12px] font-semibold text-[#15803D] text-center" role="status"></p>

      <form id="auth-form" class="space-y-4" novalidate autocomplete="off">

        <div id="signup-fields" class="space-y-4 hidden">
          <div>
            <label for="full-name" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Full name & Title</label>
            <div class="relative flex items-center">
              <i data-lucide="user" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="full-name" autocomplete="off" maxlength="80" placeholder="Dr. Innocent Ebisike" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>
          
          <div>
            <label for="role" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Role</label>
            <div class="relative flex items-center w-full">
              <select id="role" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                <option value="" disabled selected>Select your role</option>
                <option value="Community Health Worker (CHEW)">Community Health Worker (CHEW)</option>
                <option value="Medical Officer">Medical Officer</option>
                <option value="Physiotherapist">Physiotherapist</option>
                <option value="Nurse / Midwife">Nurse / Midwife</option>
                <option value="NGO / Program Supervisor">NGO / Program Supervisor</option>
                <option value="Clinic Administrator">Clinic Administrator</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label for="license-no" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Practicing License No. / Facility ID</label>
            <div class="relative flex items-center">
              <i data-lucide="shield-check" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="license-no" autocomplete="off" maxlength="40" placeholder="e.g. MDCN, NMCN, MRTBN or PHC-042" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div>
            <label for="clinic" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Clinic / organization</label>
            <div class="relative flex items-center">
              <i data-lucide="building-2" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="text" id="clinic" autocomplete="off" maxlength="120" placeholder="Rural Health Unit" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="state" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">State</label>
              <div class="relative flex items-center w-full">
                <select id="state" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]">
                  <option value="Enugu" selected>Enugu</option>
                  <option value="Lagos">Lagos</option>
                  <option value="Anambra">Anambra</option>
                  <option value="Oyo">Oyo</option>
                  <option value="Rivers">Rivers</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
            <div>
              <label for="lga" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">LGA / District</label>
              <div class="relative flex items-center w-full">
                <select id="lga" class="w-full h-[46px] bg-white dark:bg-[#0F1524] border border-[#E2E8F0] dark:border-white/10 rounded-xl px-4 pr-9 appearance-none font-medium text-[#141A29] text-left focus:outline-none focus:ring-2 focus:ring-[#52B788]/20 focus:border-[#52B788]"></select>
                <i data-lucide="chevron-down" class="absolute right-3.5 w-4 h-4 text-[#94A3B8] pointer-events-none"></i>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label for="email" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Email address</label>
          <div class="relative flex items-center">
            <i data-lucide="mail" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="email" id="email" autocomplete="off" maxlength="254" placeholder="jane.doe@example.org" class="input-field pl-10 text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
          </div>
          <p id="email-error-text" class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div>
          <label for="password" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Password</label>
          <div class="relative flex items-center">
            <i data-lucide="lock" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
            <input type="password" id="password" autocomplete="new-password" maxlength="128" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
            <button type="button" id="toggle-pw" class="absolute right-3.5 text-[#94A3B8] cursor-pointer"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
          </div>
          <p id="password-error-text" class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
        </div>

        <div id="signup-extra-fields" class="space-y-4 hidden">
          <div class="space-y-1.5">
            <div class="flex gap-1" id="strength-bars">
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
              <div class="h-1 w-full bg-[#E2E8F0] rounded-full"></div>
            </div>
            <p id="strength-label" class="text-[11px] text-[#64748B] font-medium">Password must be at least 8 characters</p>
          </div>

          <div>
            <label for="confirm-password" class="block text-[12.5px] font-semibold text-[#141A29] mb-1.5">Confirm password</label>
            <div class="relative flex items-center">
              <i data-lucide="rotate-ccw" class="absolute left-3.5 w-4 h-4 text-[#94A3B8]"></i>
              <input type="password" id="confirm-password" autocomplete="new-password" maxlength="128" placeholder="••••••••" class="input-field pl-10 pr-10 tracking-widest text-left focus:border-[#52B788] focus:ring-[#52B788]/20">
              <button type="button" id="toggle-confirm-pw" class="absolute right-3.5 text-[#94A3B8] cursor-pointer"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
            </div>
            <p class="field-error-text hidden text-[11px] font-semibold text-[#DC2626] mt-1"></p>
          </div>

          <label class="flex items-start gap-2.5 pt-1 cursor-pointer">
            <input type="checkbox" id="terms" class="mt-0.5 w-4 h-4 rounded border-[#CBD5E1]">
            <span class="text-[12px] text-[#64748B] font-medium leading-relaxed">
              I agree to the <a href="#" class="text-[#52B788] font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-[#52B788] font-semibold hover:underline">Privacy Policy</a>.
            </span>
          </label>
        </div>

        <div id="signin-extra-fields" class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-[#CBD5E1]">
            <span class="text-[13px] font-medium text-[#64748B]">Remember me</span>
          </label>
          <a href="#" id="forgot-link" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 text-[15px] font-semibold text-white bg-[#52B788] hover:bg-[#43A073] active:scale-[0.99] rounded-xl shadow-sm transition-all flex justify-center items-center gap-2 mt-2 disabled:opacity-60 disabled:cursor-not-allowed">
          Sign In
        </button>

        <p id="form-error" class="form-level-error hidden text-[12px] font-semibold text-[#DC2626] text-center" role="alert"></p>
      </form>
    </div>

    <div id="switch-row" class="mt-6 text-center">
      <span id="toggle-text" class="text-[13px] font-medium text-[#64748B]">Don't have an account?</span>
      <button id="toggle-auth" class="text-[13px] font-semibold text-[#52B788] hover:text-[#3d9169] transition-colors ml-1">Create one</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const SUPABASE_URL = 'https://rjlyoimpsamugszhsjii.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8FgHA9dB8n4nn2--FHmNUQ_FY0H-dAL';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const KEYS = {
      session: 'ruralcare_session',
      next: 'ruralcare_next',
      remember: 'rcauth_remember'
    };

    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');
    const toggleAuth = document.getElementById('toggle-auth');
    const signupFields = document.getElementById('signup-fields');
    const signupExtraFields = document.getElementById('signup-extra-fields');
    const signinExtraFields = document.getElementById('signin-extra-fields');
    const formError = document.getElementById('form-error');
    const formSuccess = document.getElementById('form-success');
    const stateSelect = document.getElementById('state');
    const lgaSelect = document.getElementById('lga');
    const roleSelect = document.getElementById('role');
    const authForm = document.getElementById('auth-form');
    const switchRow = document.getElementById('switch-row');
    const pwInput = document.getElementById('password');
    const confirmPwInput = document.getElementById('confirm-password');
    const emailInput = document.getElementById('email');

    const geoData = {
      Enugu: ["Enugu North", "Nsukka", "Enugu South", "Awgu", "Udi"],
      Lagos: ["Ikeja", "Lagos Island", "Alimosho", "Eti-Osa", "Surulere"],
      Anambra: ["Awka South", "Onitsha North", "Nnewi North", "Ihiala", "Aguata"],
      Oyo: ["Ibadan North", "Ogbomosho North", "Oyo East", "Akinyele", "Iseyin"],
      Rivers: ["Port Harcourt", "Obio-Akpor", "Bonny", "Eleme", "Ikwerre"]
    };

    function updateLGAs() {
      const selectedState = stateSelect.value;
      const lgas = geoData[selectedState] || [];
      lgaSelect.innerHTML = lgas.map(lga => `<option value="${lga}">${lga}</option>`).join('');
    }

    stateSelect.addEventListener('change', updateLGAs);
    updateLGAs();

    let isSignUp = false;
    let busy = false;

    function normEmail(v) { return String(v || '').trim().toLowerCase(); }
    function validEmail(v) { return v.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
    function clean(v, max) { return String(v || '').replace(/[<>\u0000-\u001F\u007F]/g, '').replace(/\s+/g, ' ').trim().slice(0, max); }

    function updateStrengthUI(val) {
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const colors = ['#E2E8F0', '#DC2626', '#F59E0B', '#52B788', '#389E68'];
      const labels = ['Password must be at least 8 characters', 'Weak password', 'Fair password', 'Good password', 'Strong password'];
      document.querySelectorAll('#strength-bars > div').forEach((bar, i) => {
        bar.style.background = val.length > 0 && i < score ? colors[score] : '#E2E8F0';
      });
      const label = document.getElementById('strength-label');
      if (label) label.textContent = val.length === 0 ? labels[0] : labels[score];
    }

    pwInput.addEventListener('input', (e) => {
      updateStrengthUI(e.target.value);
    });

    function setBusy(btn, on) {
      if (on) {
        if (!btn.dataset.busy) {
          btn.dataset.label = btn.innerHTML;
          btn.dataset.busy = '1';
        }
        btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
        btn.disabled = true;
      } else {
        if (btn.dataset.busy) {
          btn.innerHTML = btn.dataset.label;
          delete btn.dataset.busy;
        }
        btn.disabled = false;
      }
      lucide.createIcons();
    }

    function clearErrors() {
      document.querySelectorAll('.field-error-text').forEach(e => { e.classList.add('hidden'); e.innerHTML = ''; });
      document.querySelectorAll('.input-field').forEach(e => e.classList.remove('field-error'));
      document.querySelectorAll('.form-level-error').forEach(e => { e.classList.add('hidden'); e.innerHTML = ''; });
      formSuccess.classList.add('hidden');
      formSuccess.textContent = '';
    }

    function showFieldError(id, messageHTML) {
      const field = document.getElementById(id);
      if (!field) return;
      field.classList.add('field-error');
      const p = field.closest('div').parentElement.querySelector('.field-error-text') || field.parentElement.parentElement.querySelector('.field-error-text');
      if (p) { p.innerHTML = messageHTML; p.classList.remove('hidden'); }
    }

    function showFormError(messageHTML) {
      formError.innerHTML = messageHTML;
      formError.classList.remove('hidden');
    }

    function renderMode() {
      if (isSignUp) {
        formTitle.textContent = 'Create your account';
        formSubtitle.textContent = 'Register to manage clinical records securely.';
        submitBtn.innerHTML = 'Create Account';
        toggleText.textContent = 'Already have an account?';
        toggleAuth.textContent = 'Sign in';
        signupFields.classList.remove('hidden');
        signupExtraFields.classList.remove('hidden');
        signinExtraFields.classList.add('hidden');
        history.replaceState(null, '', 'auth.html?signup=true');
      } else {
        formTitle.textContent = 'Sign in to your workspace';
        formSubtitle.textContent = 'Access clinical records for your clinic or care team.';
        submitBtn.innerHTML = 'Sign In';
        toggleText.textContent = "Don't have an account?";
        toggleAuth.textContent = 'Create one';
        signupFields.classList.add('hidden');
        signupExtraFields.classList.add('hidden');
        signinExtraFields.classList.remove('hidden');
        const remembered = localStorage.getItem(KEYS.remember);
        if (remembered) {
          emailInput.value = remembered;
          document.getElementById('remember').checked = true;
        }
        history.replaceState(null, '', 'auth.html');
      }
      submitBtn.disabled = false;
      clearErrors();
      lucide.createIcons();
    }

    function switchToSignUpWithEmail(email) {
      isSignUp = true;
      renderMode();
      emailInput.value = email;
    }

    toggleAuth.addEventListener('click', () => {
      isSignUp = !isSignUp;
      renderMode();
    });

    document.getElementById('toggle-pw').addEventListener('click', (e) => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = show ? '<i data-lucide="eye" class="w-4 h-4"></i>' : '<i data-lucide="eye-off" class="w-4 h-4"></i>';
      lucide.createIcons();
    });

    document.getElementById('toggle-confirm-pw').addEventListener('click', (e) => {
      const show = confirmPwInput.type === 'password';
      confirmPwInput.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = show ? '<i data-lucide="eye" class="w-4 h-4"></i>' : '<i data-lucide="eye-off" class="w-4 h-4"></i>';
      lucide.createIcons();
    });

    function consumeNext() {
      const raw = new URLSearchParams(window.location.search).get('next') || sessionStorage.getItem(KEYS.next) || 'dashboard.html';
      sessionStorage.removeItem(KEYS.next);
      if (raw && typeof raw === 'string' && /^(?!\/\/)[A-Za-z0-9_\-.\/?=&%]+$/.test(raw) && !/auth\.html/i.test(raw)) {
        return raw;
      }
      return 'dashboard.html';
    }

    async function handleSignIn(email, password, valid) {
      if (!valid) return;
      busy = true;
      setBusy(submitBtn, true);
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          busy = false;
          setBusy(submitBtn, false);
          
          const errMsg = error.message.toLowerCase();
          if (errMsg.includes('invalid login credentials') || errMsg.includes('user not found')) {
            showFieldError('email', `Account not found. <button type="button" onclick="switchToSignUpWithEmail('${email}')" class="underline font-bold hover:text-[#B91C1C] ml-1">Create an account</button>`);
          } else {
            showFieldError('password', error.message);
          }
          return;
        }

        const remember = document.getElementById('remember').checked;
        if (remember) localStorage.setItem(KEYS.remember, email);
        else localStorage.removeItem(KEYS.remember);

        window.location.replace(consumeNext());
      } catch (err) {
        busy = false;
        setBusy(submitBtn, false);
        showFormError('Something went wrong. Please try again.');
      }
    }

    async function handleSignUp(email, password, valid) {
      const name = clean(document.getElementById('full-name').value, 80);
      const clinic = clean(document.getElementById('clinic').value, 120);
      const role = roleSelect.value;
      const licenseNo = clean(document.getElementById('license-no').value, 40);
      const state = stateSelect.value;
      const lga = lgaSelect.value;
      const confirm = confirmPwInput.value;
      const terms = document.getElementById('terms').checked;

      if (!name) { showFieldError('full-name', 'Full name is required.'); valid = false; }
      if (!role) { showFieldError('role', 'Select your role.'); valid = false; }
      if (!clinic) { showFieldError('clinic', 'Clinic is required.'); valid = false; }
      if (confirm !== password || !confirm) { showFieldError('confirm-password', 'Passwords do not match.'); valid = false; }
      if (!terms) { showFormError('Please accept the Terms of Service to continue.'); valid = false; }

      if (!valid) return;

      busy = true;
      setBusy(submitBtn, true);
      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { name, role, clinic, licenseNo, state, lga }
          }
        });

        if (error) {
          busy = false;
          setBusy(submitBtn, false);
          if (error.message.toLowerCase().includes('already registered')) {
            showFieldError('email', 'An account already exists with this email address.');
          } else {
            showFormError(error.message);
          }
          return;
        }

        window.location.replace(consumeNext());
      } catch (err) {
        busy = false;
        setBusy(submitBtn, false);
        showFormError('Something went wrong. Please try again.');
      }
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;
      clearErrors();
      let valid = true;

      const email = normEmail(emailInput.value);
      const password = pwInput.value;

      if (!validEmail(email)) { showFieldError('email', 'Enter a valid email address.'); valid = false; }
      if (!password || password.length < 8) {
        showFieldError('password', 'Password must be at least 8 characters.');
        valid = false;
      }

      if (isSignUp) await handleSignUp(email, password, valid);
      else await handleSignIn(email, password, valid);
    });

    (async function boot() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('signup') === 'true') {
        isSignUp = true;
      }
      renderMode();

      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.replace(consumeNext());
      }
    })();
  </script>
</body>
</html>
